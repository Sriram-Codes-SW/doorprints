# LOCAL DEVELOPMENT ONLY. `APP_API_KEY=$(openssl rand -hex 32) docker compose up --build` starts PostGIS + pgvector
# and the API on http://127.0.0.1:8080. Both ports are bound to the loopback interface only, so nothing is reachable
# from the network even on a VM with a public IP (threat model F-17). For a public server use a managed Postgres or
# a separate hardened compose file with secrets from the environment (docs/07-secure-build-and-deploy.md).
#
# AI features are off by default; to try them, also export APP_AI_ENABLED=true and AI_API_KEY=<free Gemini key>
# (see docs/ai/ai-design.md). Every AI_* / APP_AI_* / APP_MCP_* variable below is read from the host shell (or a
# git-ignored .env file next to this file); unset means the default shown, which matches application.yml.
#
# Example: Gemini API free tier (chat via its OpenAI-compatible endpoint, embeddings via the native API):
#   export APP_AI_ENABLED=true
#   export AI_API_KEY=<key from https://aistudio.google.com/apikey>
#   # optional: AI_CHAT_MODEL=gemini-3.5-flash AI_EMBEDDING_MODEL=gemini-embedding-2 (the defaults)
#
# Example: Google Cloud Vertex AI (paid key with a hard cap; docs/ai/vertex-setup.md). Authentication is
#   Application Default Credentials only — there is no Vertex API key — so the container needs your ADC file.
#   Compose cannot mount a file conditionally, so the two `volumes:` lines under `api:` are commented out; uncomment
#   them (and the GOOGLE_APPLICATION_CREDENTIALS line) the first time you use this, after
#   `gcloud auth application-default login`:
#   export APP_AI_ENABLED=true
#   export AI_PROVIDER=vertex GCP_PROJECT_ID=<your project> GCP_LOCATION=asia-south1
#   export AI_VERTEX_EMBEDDING_LOCATION=global   # if the embedding model is not offered in GCP_LOCATION
#   # No AI_API_KEY. The ADC file (~/.config/gcloud/application_default_credentials.json) holds a refresh token:
#   # it is mounted read-only and must never be copied into an image or committed.
#
# Example: local Ollama on the host (nothing leaves the machine; run `ollama pull qwen3:8b` and
#   `ollama pull nomic-embed-text` first):
#   export APP_AI_ENABLED=true
#   export AI_BASE_URL=http://host.docker.internal:11434/v1
#   export AI_API_KEY=ollama                  # any non-empty value; Ollama ignores it
#   export AI_CHAT_MODEL=qwen3:8b
#   export AI_EMBEDDING_PROVIDER=openai       # OpenAI-compatible /embeddings at AI_BASE_URL
#   export AI_EMBEDDING_MODEL=nomic-embed-text  # 768-dimensional, matches the vector(768) column
#   export AI_EMBEDDING_DIMENSIONS=768
#   export AI_TIMEOUT=180s                    # local models are slower on CPU
#   # On Linux, start Ollama with OLLAMA_HOST=0.0.0.0 so the container can reach it through host-gateway.
# Doorprints (formerly House Hunt): there is deliberately no top-level `name:` and the volume is still `dbdata18`.
# Compose prefixes volumes with the project name (the checkout folder by default), so renaming the project or the
# volume would start an empty database; the image tag house-hunt-db also stays, matching CI and the runbook.
services:
  db:
    build: ./backend/db
    image: house-hunt-db:pg18
    environment:
      POSTGRES_DB: househunt
      POSTGRES_USER: househunt
      # Dev default is acceptable only because the port is loopback-only; override with POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-househunt}
    ports: ["127.0.0.1:5432:5432"]
    # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent.
    volumes: [dbdata18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U househunt -d househunt"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/househunt
      DB_USER: househunt
      DB_PASSWORD: ${POSTGRES_PASSWORD:-househunt}
      # No default: compose refuses to start without a key (and the API refuses keys shorter than 32 chars, F-01).
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY to a random secret of at least 32 characters, for example the output of openssl rand -hex 32}
      # Optional second key accepted alongside APP_API_KEY during a rotation (SEC-017, drill TC-O-02). Empty = none;
      # if set it must also be at least 32 chars. Rotate: set it, move clients, promote it to APP_API_KEY, clear it.
      APP_API_KEY_NEXT: ${APP_API_KEY_NEXT:-}
      # Browser origins allowed to call the API: comma-separated origins (scheme://host[:port]), no path, no trailing
      # slash. The default allows only the Angular dev server. To sync the live web app on Firebase Hosting with this
      # server, opt in before `docker compose up`:
      #   export APP_CORS_ORIGINS=http://localhost:4200,https://doorprints.web.app
      # (https://doorprints.firebaseapp.com serves the same site but is a separate origin with its own browser data;
      # add it only if you use that address.) The public origin is deliberately not the default here or in
      # application.yml: every server started with the defaults would then answer that website from the user's
      # browser, so a bad deploy of the site or a script injected into it could read and change the data of any such
      # server whose key the user has saved there. Allowing it is each server owner's choice. The site is HTTPS: it
      # can reach this loopback-only http:// server only where the browser exempts localhost (Chrome asks the user
      # first); docs/07 section 6 has the https:// setup.
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:4200}
      # POST /api/import (restoring a doorprints-backup/1 file): body and row caps, see application.yml. 16 MiB is
      # the data.json cap of the device readers too (docs/schemas/README.md section 7): keep them equal.
      MAX_IMPORT_BYTES: ${MAX_IMPORT_BYTES:-16777216}
      MAX_IMPORT_ROWS: ${MAX_IMPORT_ROWS:-20000}
      # --- AI (docs/ai/ai-design.md). Off unless APP_AI_ENABLED=true; defaults mirror application.yml. ---
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      APP_MCP_ENABLED: ${APP_MCP_ENABLED:-false}
      # Which provider serves chat and embeddings: aistudio (default, AI_API_KEY below) or vertex (Google Cloud
      # Vertex AI with Application Default Credentials, docs/ai/vertex-setup.md). Both code paths stay in the
      # image, so switching back is one variable. The AI_* limits, models and retries below apply to both.
      AI_PROVIDER: ${AI_PROVIDER:-aistudio}
      # Embed a house right after each save; false = only POST /api/ai/reindex embeds (fewer provider calls).
      AI_INDEX_ON_CHANGE: ${AI_INDEX_ON_CHANGE:-true}
      # Chat: any OpenAI-compatible endpoint (Gemini's by default, or Ollama's /v1).
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      # Secret: never commit it; required (non-empty) only when APP_AI_ENABLED=true and AI_PROVIDER=aistudio. The
      # vertex path uses Application Default Credentials and needs GCP_PROJECT_ID instead of a key.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-3.5-flash}
      AI_TIMEOUT: ${AI_TIMEOUT:-60s}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      # Embeddings: google-genai (native Gemini API, default) or openai (AI_BASE_URL /embeddings, e.g. Ollama).
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-google-genai}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-2}
      # Must stay 768 to match the vector(768) column in Flyway V2.
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
      # Used only by the google-genai provider.
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      # Falls back to AI_API_KEY here: an empty value would be passed through and defeat application.yml's fallback.
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-${AI_API_KEY:-}}
      # Empty = no task type (gemini-embedding-2 rejects one; gemini-embedding-001 accepts e.g. RETRIEVAL_DOCUMENT).
      AI_EMBEDDING_TASK_TYPE: ${AI_EMBEDDING_TASK_TYPE:-}
      AI_VECTOR_INIT_SCHEMA: ${AI_VECTOR_INIT_SCHEMA:-false}
      # Abuse / free-tier quota guards.
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-8000}
      AI_MAX_QUESTION_CHARS: ${AI_MAX_QUESTION_CHARS:-1000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      AI_RATE_LIMIT_BURST: ${AI_RATE_LIMIT_BURST:-5}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      AI_RAG_TOP_K: ${AI_RAG_TOP_K:-6}
      AI_RAG_SIMILARITY_THRESHOLD: ${AI_RAG_SIMILARITY_THRESHOLD:-0.25}
      AI_AGENT_MAX_TOOL_CALLS: ${AI_AGENT_MAX_TOOL_CALLS:-12}
      AI_AGENT_MAX_CALLS_PER_TOOL: ${AI_AGENT_MAX_CALLS_PER_TOOL:-4}
      AI_AGENT_MAX_STOPS: ${AI_AGENT_MAX_STOPS:-8}
      # --- Vertex AI (only read when AI_PROVIDER=vertex). No key: authentication is Application Default
      # Credentials, so either mount the ADC file (see the volumes below) or run on a host with a service
      # account attached. Empty values mean "use the default" exactly as in application.yml. ---
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      # Mumbai (India data residency / latency); `global` has the widest model availability.
      GCP_LOCATION: ${GCP_LOCATION:-asia-south1}
      # Empty = same as GCP_LOCATION. Set (e.g. global) when the embedding model is not offered there.
      AI_VERTEX_EMBEDDING_LOCATION: ${AI_VERTEX_EMBEDDING_LOCATION:-}
      # Empty = derived from the location (https://<location>-aiplatform.googleapis.com).
      AI_VERTEX_ENDPOINT: ${AI_VERTEX_ENDPOINT:-}
      AI_VERTEX_API_VERSION: ${AI_VERTEX_API_VERSION:-v1beta1}
      # Uncomment together with the volumes below to hand the container your gcloud ADC file.
      # GOOGLE_APPLICATION_CREDENTIALS: /adc/application_default_credentials.json
    # Uncomment for AI_PROVIDER=vertex with a local `gcloud auth application-default login` (read-only, and the
    # file stays on the host). Leave commented otherwise: a bind mount of a file that does not exist fails the
    # whole `docker compose up`, and compose has no way to make one optional.
    # volumes:
    #   - ${HOME}/.config/gcloud/application_default_credentials.json:/adc/application_default_credentials.json:ro
    # Lets AI_BASE_URL=http://host.docker.internal:11434/v1 reach an Ollama on the host (Docker Desktop defines this
    # name already; on Linux Engine it needs the host-gateway mapping). Unused while AI is off.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080"]
    # The image runs as UID 10001 (see backend/Dockerfile); the filesystem is read-only except /tmp (multipart).
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
volumes:
  dbdata18:
