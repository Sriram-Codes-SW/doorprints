<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">How your own Doorprints server fits together</title>
  <desc id="d">Your phone and browser reach the Doorprints server on your computer through Tailscale's private https address, using your Doorprints API key. The server runs in Docker and, only if AI is on, sends questions to Google Gemini with your Gemini key.</desc>
  <style>
    text { font-family: Roboto, "Segoe UI", Arial, sans-serif; fill: #1b1b1b; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; }
    .k { font-size: 12.5px; fill: #17574a; font-weight: 700; }
    .box { fill: #eef6f3; stroke: #1f6f5c; stroke-width: 2; }
    .opt { fill: #f6f6f6; stroke: #8a8a8a; stroke-width: 2; stroke-dasharray: 6 4; }
    .a { stroke: #1f6f5c; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .ao { stroke: #8a8a8a; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f5c"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
  </defs>
  <rect width="800" height="230" fill="#ffffff"/>
  <rect class="box" x="15" y="45" width="190" height="120" rx="12"/>
  <text class="h" x="110" y="80" text-anchor="middle">Your phone</text>
  <text class="s" x="110" y="102" text-anchor="middle">and browser</text>
  <text class="s" x="110" y="124" text-anchor="middle">Doorprints app</text>
  <text class="s" x="110" y="144" text-anchor="middle">+ Tailscale app</text>

  <path class="a" d="M210 105 H325"/>
  <text class="k" x="267" y="88" text-anchor="middle">https://…ts.net</text>
  <text class="k" x="267" y="128" text-anchor="middle">Doorprints API key</text>

  <rect class="box" x="330" y="30" width="220" height="150" rx="12"/>
  <text class="h" x="440" y="65" text-anchor="middle">Your computer</text>
  <text class="s" x="440" y="90" text-anchor="middle">Docker Desktop runs the</text>
  <text class="s" x="440" y="110" text-anchor="middle">Doorprints server and</text>
  <text class="s" x="440" y="130" text-anchor="middle">its database</text>
  <text class="s" x="440" y="155" text-anchor="middle">Settings in .env</text>

  <path class="ao" d="M555 105 H645"/>
  <text class="k" x="600" y="88" text-anchor="middle">only if AI</text>
  <text class="k" x="600" y="128" text-anchor="middle">Gemini key</text>

  <rect class="opt" x="650" y="55" width="135" height="100" rx="12"/>
  <text class="h" x="717" y="92" text-anchor="middle">Google</text>
  <text class="h" x="717" y="114" text-anchor="middle">Gemini</text>
  <text class="s" x="717" y="137" text-anchor="middle">(optional)</text>

  <text class="s" x="400" y="215" text-anchor="middle">Only your own devices, signed in to your Tailscale account, can reach the server.</text>
</svg>
