# The Doorprints user guide site (owner request of 2026-09-29). Built by .github/workflows/pages.yml with
# `mkdocs build --strict` and published to GitHub Pages from main. Pages live in docs/, images in docs/images/.
# Hindi, Tamil and Telugu (S4b-BL-60): mkdocs.<lang>.yml with its pages in i18n/<lang>/, built by hooks/i18n.py right
# after this one into <site>/<lang>/, with Material's language selector (extra.alternate) on every page.
site_name: Doorprints user guide
site_description: How to use Doorprints, the app that remembers the houses you visit while house-hunting in India.
site_url: https://sriram-codes-sw.github.io/doorprints/
repo_url: https://github.com/Sriram-Codes-SW/doorprints
repo_name: Sriram-Codes-SW/doorprints
edit_uri: edit/main/guide/docs/
# page.html rather than page/: the pages' side-by-side phone screenshots are raw <img> tags, whose relative src MkDocs
# does not rewrite, so every page must sit next to images/.
use_directory_urls: false
copyright: Doorprints. Free and open source (AGPL-3.0-only); no advertising.

nav:
  - Home: index.md
  - The screen at a glance: screen-at-a-glance.md
  - Phone or computer: phone-or-computer.md
  - Your houses: houses.md
  - Compare and plan: compare-and-plan.md
  - Your data: your-data.md
  - Google Drive backups: google-drive.md
  - Server and sharing: server-and-sharing.md
  - Set up your own server: set-up-a-server.md
  - Hunt mode: hunt-mode.md
  - Your paths: your-paths.md
  - Language, theme, privacy, offline maps: settings-and-privacy.md
  - Troubleshooting and FAQ: faq.md

theme:
  name: material
  language: en
  # partials/alternate.html: the language selector opens the same page in the other language.
  custom_dir: overrides
  logo: images/favicon.svg
  favicon: images/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit
  palette:
    # Doorprints green (#1F6F5C, web/src/styles.css); light and dark follow the device.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme

extra_css:
  - stylesheets/doorprints.css

# The search box also searches text that arrives without a key-up (paste, voice, a tapped suggestion); the
# translations inherit this and get the file from the English docs (hooks/i18n.py).
extra_javascript:
  - javascripts/search-input.js

hooks:
  - hooks/i18n.py

# The language selector: each link is that language's site root, relative to this one's (the translations repeat it).
extra:
  alternate:
    - name: English
      link: ""
      lang: en
    - name: हिन्दी
      link: hi/
      lang: hi
    - name: தமிழ்
      link: ta/
      lang: ta
    - name: తెలుగు
      link: te/
      lang: te

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Code blocks inside numbered and bulleted lists (the server set-up steps), with syntax colours.
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
