<div class="drive-join-container">
  <div class="card-section">
    <h3>{{ 'driveJoin.heading' | t }}</h3>
    <p class="muted">{{ 'driveJoin.description' | t }}</p>

    <label for="recovery-key-input">{{ 'driveJoin.label' | t }}</label>
    <input
      #keyInput
      id="recovery-key-input"
      type="text"
      class="input-monospace"
      [value]="recoveryKeyText()"
      (input)="onKeyInput($event)"
      (keydown)="onKeyDown($event)"
      [disabled]="busy()"
      autocomplete="off"
      spellcheck="false"
      autocapitalize="off"
      inputmode="text"
      aria-describedby="recovery-key-help"
      placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX"
    />
    <small id="recovery-key-help" class="help-text">
      {{ 'driveJoin.helpText' | t }}
    </small>

    <div aria-live="polite" aria-atomic="true" class="error-region">
      @if (errorMessage(); as error) {
        <p class="error-message">{{ error | t }}</p>
      }
    </div>

    <div class="actions">
      <button
        type="button"
        class="btn btn-primary"
        (click)="onJoin()"
        [disabled]="busy() || !recoveryKeyText().trim()"
      >
        @if (busy()) {
          {{ 'common.loading' | t }}
        } @else {
          {{ 'driveJoin.joinButton' | t }}
        }
      </button>
    </div>

    <p class="muted secondary-text">
      {{ 'driveJoin.lostKeyMessage' | t }}
    </p>

    <p class="disconnect-link">
      <button
        type="button"
        class="link-button"
        (click)="onDisconnect()"
        [disabled]="busy()"
        aria-label="{{ 'driveJoin.disconnectAriaLabel' | t }}"
      >
        {{ 'driveJoin.disconnect' | t }}
      </button>
    </p>
  </div>
</div>
