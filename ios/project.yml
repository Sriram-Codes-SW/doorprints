# The Doorprints iOS app (CMP-8b, the map CMP-8c; ADR-23): a thin SwiftUI shell around the Compose Multiplatform UI
# of the Gradle module :ui (android/ui), which Gradle builds as the static framework DoorprintsKit. XcodeGen 2.46.0 turns this file
# into Doorprints.xcodeproj (not committed; ios/.gitignore): `cd ios && xcodegen generate`. CI: the ios-app job of
# .github/workflows/shared-ios.yml. Ad-hoc signed for the simulator: no certificate, no Apple account, no App Store
# (owner rules; ios/README.md).
#
# The Kotlin framework is wired in the way JetBrains' "direct integration" describes (Kotlin Multiplatform docs,
# "Connect the framework to your iOS project"): a Run Script before the Swift sources calls Gradle's
# embedAndSignAppleFrameworkForXcode, which reads Xcode's environment (CONFIGURATION, SDK_NAME, ARCHS, ...), builds the
# matching framework into android/ui/build/xcode-frameworks/<CONFIGURATION>/<SDK_NAME> and copies the Compose
# resources into the app bundle (compose-resources/); the search path and -framework below link it. DoorprintsKit is
# static, so there is nothing to embed or sign at run time.
name: Doorprints

options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: en
  # iOS 17.0. Compose Multiplatform 1.12 and Kotlin/Native support older iOS versions, so this is our choice, not a
  # library minimum: iOS 17 runs on every iPhone from 2018 (XS, XR) on, and one floor keeps the untested surface
  # (older UIKit and SwiftUI behaviour, the simulator runtimes CI would need) small. Lower it only with a reason and
  # a simulator run on that version. Set here only: XcodeGen applies it to the target too.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# MapLibre iOS (CMP-8c), the map engine: MapLibre's own Swift package, pinned to the commit of its tag 6.31.0 (the
# package's binary target pins the xcframework by SHA-256 in turn). A new version is a reviewed change here: read its
# changelog, update the revision and the check in shared-ios.yml's ios-app job, and run the iOS app job.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    revision: 13e41ab3d77ff5113e7e5d4ee87803b1f81f5683

settings:
  base:
    MARKETING_VERSION: "0.1.0"  # the Android app's versionName (android/app/build.gradle.kts)
    CURRENT_PROJECT_VERSION: "1"

targets:
  Doorprints:
    type: application
    platform: iOS
    # Swift files, the hand-written Info.plist (XcodeGen leaves a file named Info.plist out of the build phases) and
    # the <lang>.lproj folders, which XcodeGen turns into a localised InfoPlist.strings in Copy Bundle Resources
    # (en, hi, ta, te: the location purpose string).
    sources:
      - path: Doorprints
      # India's outline and the held areas' polygon (ADR-22), bundled as the folder geo/ (a folder reference, so the
      # files keep their path; the map reads them as geo/<file>): Android's copy itself, which IndiaBoundaryDataTest
      # holds byte-identical to the web's, so there is no third copy to keep in step.
      - path: ../android/app/src/main/assets/geo
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_NAME: Doorprints
        PRODUCT_BUNDLE_IDENTIFIER: app.doorprints
        INFOPLIST_FILE: Doorprints/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # Swift 5 language mode: the shell is two small types; Swift 6's strict concurrency checks buy nothing here.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only for now; the layouts are phone layouts
        # The Gradle script writes android/ui/build and the app bundle's compose-resources, outside the paths Xcode's
        # script sandbox allows; the Kotlin Gradle plugin refuses to run with the sandbox on.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Kotlin/Native builds the simulator framework for arm64 only (iosSimulatorArm64; no iosX64 target).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../android/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "DoorprintsKit"
        # No team, no certificate: simulator builds are signed ad hoc (identity "-"), which needs no Apple account
        # and gives the app a real signature, so the simulator gives it its own Keychain (owner-approved; CI passes
        # the same identity, with CODE_SIGNING_REQUIRED=NO). Manual, not Automatic: automatic signing with no team
        # can make xcodebuild ask for a team, and an identity given on the command line conflicts with it. To run on
        # an iPhone, choose a team and Automatic in Xcode (a free Apple ID is enough for your own device).
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    preBuildScripts:
      - name: Build the Kotlin framework (Gradle, :ui)
        shell: /bin/bash
        # Always run: Gradle does its own up-to-date checks, and Xcode cannot see the Kotlin sources.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Xcode starts scripts with a minimal environment: JAVA_HOME is set when xcodebuild was started from a
          # shell that has it (CI: actions/setup-java), but usually not when the build runs from the Xcode app.
          if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
            if JAVA_HOME="$(/usr/libexec/java_home -v 21 2>/dev/null)"; then
              export JAVA_HOME
            else
              echo "error: Doorprints needs JDK 21 to build the Kotlin framework. Install one (for example Temurin 21) or set JAVA_HOME; /usr/libexec/java_home -v 21 found none."
              exit 1
            fi
          fi
          echo "Using JAVA_HOME=${JAVA_HOME}"
          cd "$SRCROOT/../android"
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
    # A shared scheme named Doorprints (Debug to run, Release to archive), so `xcodebuild -scheme Doorprints` works on
    # a fresh checkout.
    scheme: {}
