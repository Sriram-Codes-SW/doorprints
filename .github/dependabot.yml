# Dependency updates (threat model T-T5 / SEC-013), tuned after the first push opened a flood of PRs:
# - weekly, Monday morning IST, at most 5 open PRs per ecosystem;
# - minor and patch updates grouped into one PR per ecosystem (security updates are grouped separately);
# - major bumps of the pinned frameworks (Spring Boot, Angular, AGP, Kotlin) are ignored: those upgrades are
#   planned and done by hand (docs/07 section 1). Dependabot security updates still apply where a patch exists.
# 2026-09-22 (DevSecOps):
# - docker: the maven build image may no longer move to a non-LTS JDK (PR #6 proposed maven:3-eclipse-temurin-26;
#   the project is on Java 25 LTS). See the maven ignore rule below.
# - npm: major bumps of web dev dependencies (e.g. jsdom, vitest) are grouped into one weekly PR (npm-dev-major).
#   Already open individual PRs (#7 jsdom 30, #8 vitest 5) are left for the Web team to evaluate.
# 2026-09-23 (DevSecOps):
# - npm: new entry for /.github/firebase-tools (pinned firebase-tools CLI of the Firebase Hosting deploy), with a
#   7-day cooldown for version updates.
# - github-actions: third-party actions are now all pinned by commit SHA with a version comment (gradle/actions
#   v6.3.0 added; google-github-actions/auth v3.0.0 and zaproxy/action-baseline v0.15.0 already were); the entry
#   below keeps those SHAs current.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      maven-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      # One weekly PR for all major bumps of devDependencies (test/build tooling); the Web team evaluates it as a
      # unit. Production-dependency majors still come as individual PRs. Angular/TypeScript majors stay ignored.
      npm-dev-major:
        applies-to: version-updates
        dependency-type: development
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Angular majors (and the TypeScript range each Angular major supports) move together via `ng update`.
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]

  # The Firebase CLI that deploys the web app (.github/workflows/web.yml, job deploy-firebase; owner DevSecOps).
  # firebase-tools is pinned to one exact version and runs with the deploy credential, so every update, majors
  # included, comes as one PR that DevSecOps reviews; web.yml's firebase-config job installs it on that PR.
  # Cooldown: a new release waits 7 days before a version-update PR proposes it (supply-chain delay; security
  # updates are not delayed).
  - package-ecosystem: npm
    directory: /.github/firebase-tools
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      firebase-tools-updates:
        applies-to: version-updates
        patterns: ["*"]
      firebase-tools-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "com.android.application"
        update-types: [version-update:semver-major]
      # Plugin of the KMP module android/shared (Sprint 3.5); same version as AGP, so it moves with the manual AGP upgrade.
      - dependency-name: "com.android.kotlin.multiplatform.library"
        update-types: [version-update:semver-major]
      - dependency-name: "com.android.tools.build:*"
        update-types: [version-update:semver-major]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: [version-update:semver-major]
      # KSP versions follow the Kotlin version, so they move with the manual Kotlin upgrade.
      - dependency-name: "com.google.devtools.ksp*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /backend/db]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Base images track JDK 25 and PostgreSQL 18; major moves are planned upgrades.
      # Covers eclipse-temurin:25-jre (25 -> 26 is a major) and postgis/postgis:18-3.6 (18 -> 19).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # maven:3.9-eclipse-temurin-25 (backend/Dockerfile build stage): Dependabot reads the JDK number as the last
      # version segment (numeric version 3.9.25; "3-eclipse-temurin-26" reads as 3.26), so a JDK change is NOT a
      # semver-major and the rule above does not stop it (PR #6). Tag wildcards are not supported for docker ignores;
      # `versions` are Ruby Gem requirements on that numeric version (dependabot-core docker/requirement.rb, tag.rb).
      # Allowed: 3.9-eclipse-temurin-25 and 3.10-eclipse-temurin-25. Ignored: JDK > 25 on 3.9, any JDK other than 25
      # on 3.10, every Maven-only floating tag "3-eclipse-temurin-NN" (3.NN, NN >= 11) and Maven >= 3.11 / 4 (planned
      # upgrades). Lower JDKs on 3.9 need no rule: Dependabot drops version downgrades itself.
      # JDK moves (next LTS: 29) are done by hand together with pom.xml and the CI setup-java versions.
      # NOT YET EXERCISED: the version parsing above was read from dependabot-core main, not from the hosted
      # Dependabot release, and no Dependabot run has used this rule yet. This file does not close PR #6
      # (maven:3-eclipse-temurin-26): the owner closes it or comments "@dependabot ignore this version". After the
      # next Monday run, check that PR #6 is not reopened or superseded by a JDK 26/27 maven PR; if it is, replace
      # these ranges with a plain `update-types: [version-update:semver-minor]` ignore for "maven".
      - dependency-name: "maven"
        versions: [">= 3.9.26, < 3.10", ">= 3.10.26, < 3.11", "< 3.10.25, >= 3.10", ">= 3.11"]
