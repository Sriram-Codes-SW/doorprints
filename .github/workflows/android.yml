# Android: debug APK + JVM unit tests + lint (report only); signed release APK on main when the keystore secrets exist. The APK artifact is how the app is installed (sideload), see README.md.
name: Android

# Path filters cover every file the build and tests read, not only android/** (same rule as backend.yml).
# The two lists below are identical and must stay that way (GitHub Actions does not support YAML anchors).
#
# Triggers: a push to main that touches one of the paths below, a pull request to main (tests the merge result; also
# covers fork PRs) and manual runs; tag pushes do not trigger. From 2026-09-23 to 2026-09-29 every branch push ran
# it too (two runs per push with a pull request open); since the delivery-speed review of 2026-09-29 (docs/14 §7)
# the pull request run alone is the pre-merge signal. The signing key is used on main only (release-signing-check
# below).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      # The export/backup contract sample. Load-bearing: CanonicalSampleTest (app JVM unit tests) walks up to
      # docs/schemas/backup-sample.json, so editing the shared format sample alone can turn this workflow red.
      - "docs/schemas/**"
      # India's boundary file, web copy (owner issue P0, 2026-09-24). Load-bearing: IndiaBoundaryDataTest (app JVM
      # unit tests) walks up to web/public/geo/in-boundaries.geojson and fails unless it is byte-identical to
      # android/app/src/main/assets/geo/in-boundaries.geojson with the reviewed sha256, so editing the web copy
      # alone can turn this workflow red (android/shared/README.md section 9, item 35).
      - "web/public/geo/**"
      # The AI test vectors (S4b-BL-105). Load-bearing: ParityVectorsFileTest (:shared:testAndroidHostTest) fails
      # unless the common tests' copy and the website's copy equal docs/ai/evals/parity-vectors.json, so editing
      # either file alone can turn this workflow red.
      - "docs/ai/evals/parity-vectors.json"
      - "web/src/app/core/ai/parity-vectors.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/schemas/**"
      - "web/public/geo/**"
      - "docs/ai/evals/parity-vectors.json"
      - "web/src/app/core/ai/parity-vectors.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs (only contents: read).
permissions: {}

# One run per ref: a newer push to a branch (or a pull request, ref refs/pull/<n>/merge) cancels the older run;
# runs on main always finish.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: assembleDebug + unit tests (JDK 21)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper JAR checksum (protects against a tampered gradle-wrapper.jar).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Sprint 3.5: android/shared is the Kotlin Multiplatform module :shared (com.android.kotlin.multiplatform.library,
      # compile-only iOS targets). It has no testDebugUnitTest; its JVM tests (commonTest + androidHostTest, enabled
      # with withHostTest {}) are the task :shared:testAndroidHostTest. The app's testDebugUnitTest already depends on
      # it (app/build.gradle.kts); it is named here as well so the shared tests run even if that wiring changes, and so
      # a moved or renamed module fails this step loudly instead of being skipped. The same holds for :ui (the Compose
      # Multiplatform UI module, ADR-23): :ui:testAndroidHostTest. compileCommonMainKotlinMetadata compiles each KMP
      # module's commonMain against the common (non-JVM) libraries, on Linux without Kotlin/Native, so a JVM-only API in
      # common code (it caught Float.nextDown) fails here before the macOS iOS job (shared-ios.yml) runs.
      # -Proborazzi.test.verify=true: the screenshot tests (app/src/test/.../screenshots, docs/06 TC-U-56) compare each
      # screen with its reference image in app/src/test/screenshots and fail on a difference; the diff images are in
      # the android-reports artifact (app/build/outputs/roborazzi). Re-record with ./gradlew :app:recordRoborazziDebug.
      # :shared:allTests is deliberately not run here: on Linux it would only add the cross-compiled iOS test klibs,
      # which downloads the Kotlin/Native toolchain (~/.konan) on every run. iOS is covered on macOS by shared-ios.yml.
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest :shared:testAndroidHostTest :ui:testAndroidHostTest \
            :shared:compileCommonMainKotlinMetadata :ui:compileCommonMainKotlinMetadata -Proborazzi.test.verify=true

      # Android lint (includes MissingTranslation as an error, see app/build.gradle.kts). Reported, not yet
      # blocking: switch continue-on-error off once the first report is clean.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      # Artifact names follow the product name Doorprints (were house-hunt-*-apk until 2026-09-22).
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: doorprints-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/shared/build/reports/
            android/shared/build/test-results/
            android/ui/build/reports/
            android/ui/build/test-results/
            android/app/build/outputs/roborazzi/
          retention-days: 7

  # Release security gate (S4b-SEC-1, docs/06 TC-S-06): MobSF's static scan of the release build, in parallel with
  # `build` so the workflow takes no longer. The release variant unsigned (the signing key stays on main; the signed
  # APK's signature is checked by `release`, TC-S-15), scanned through MobSF's REST API (android/ci/mobsf-scan.sh,
  # MobSF pinned by digest). Blocking: a High finding not reviewed in android/ci/mobsf-accepted.json, or any tracker.
  mobsf:
    name: MobSF static scan of the release APK
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: assembleRelease (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: MobSF static scan
        run: |
          chmod +x ci/mobsf-scan.sh
          ci/mobsf-scan.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/mobsf" ci/mobsf-accepted.json

      - name: Upload the MobSF report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-mobsf-report
          path: ${{ runner.temp }}/mobsf
          if-no-files-found: ignore
          retention-days: 30

  # Only for a push to main or a manual run on main: never for pull requests and never for a push to (or a manual
  # run on) any other branch, because code that has not been merged into main must not run with the signing key.
  # The ref check is what keeps the key on main (this workflow also runs on pull requests and manual runs).
  # `secrets` cannot be used in a job-level `if`, so this job checks for them and the release job keys off its output
  # (skipped here => output empty => release skipped).
  release-signing-check:
    name: Release signing secrets present?
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          HH_KEYSTORE_BASE64: ${{ secrets.HH_KEYSTORE_BASE64 }}
          HH_KEYSTORE_PASSWORD: ${{ secrets.HH_KEYSTORE_PASSWORD }}
          HH_KEY_ALIAS: ${{ secrets.HH_KEY_ALIAS }}
          HH_KEY_PASSWORD: ${{ secrets.HH_KEY_PASSWORD }}
        run: |
          if [ -n "$HH_KEYSTORE_BASE64" ] && [ -n "$HH_KEYSTORE_PASSWORD" ] && [ -n "$HH_KEY_ALIAS" ] && [ -n "$HH_KEY_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not set (HH_KEYSTORE_BASE64, HH_KEYSTORE_PASSWORD, HH_KEY_ALIAS, HH_KEY_PASSWORD); signed release build skipped."
          fi

  # Signed release APK (threat model F-11). app/build.gradle.kts reads HH_KEYSTORE_FILE, HH_KEYSTORE_PASSWORD,
  # HH_KEY_ALIAS and HH_KEY_PASSWORD from Gradle properties or environment variables; the keystore is decoded to
  # the runner's temp directory (never the workspace) and deleted at the end.
  release:
    name: Signed release APK
    needs: [build, release-signing-check]
    if: needs.release-signing-check.outputs.present == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode keystore
        env:
          HH_KEYSTORE_BASE64: ${{ secrets.HH_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$HH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doorprints-release.jks"
          test -s "$RUNNER_TEMP/doorprints-release.jks"

      - name: assembleRelease (signed)
        env:
          HH_KEYSTORE_FILE: ${{ runner.temp }}/doorprints-release.jks
          HH_KEYSTORE_PASSWORD: ${{ secrets.HH_KEYSTORE_PASSWORD }}
          HH_KEY_ALIAS: ${{ secrets.HH_KEY_ALIAS }}
          HH_KEY_PASSWORD: ${{ secrets.HH_KEY_PASSWORD }}
          # The Android OAuth client id for the browser sign-in fallback (docs/15 §2.4): a repository VARIABLE, not a secret
          # (it is a public identifier). Empty when the variable is not set: the browser fallback then stays unavailable.
          GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      # With a signingConfig AGP writes app-release.apk; an unsigned build would be app-release-unsigned.apk.
      - name: Verify APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/doorprints-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: doorprints-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
