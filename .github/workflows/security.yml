# Security scans (docs/07 section 4, threat model F-22 / SEC-013 / SEC-014). All free and open source.
#
# CodeQL is not here: it has its own workflow, .github/workflows/codeql.yml (added 2026-09-22, Sprint 4a). It is
# free because the repository is public since Sprint 3.5; on a private repository code scanning and SARIF upload to
# the Security tab need a paid GitHub Advanced Security licence (CON-01 zero cost), which is why the scanners in
# this file keep their reports as workflow artifacts instead of uploading SARIF. CodeQL analyses Java (backend) and
# JavaScript/TypeScript (web) without a build; Android Kotlin is covered by Semgrep below, not by CodeQL.
#
# Android (Gradle) dependencies: `trivy fs` only reads Gradle lock files (gradle.lockfile), which android/ does not
# have yet, and Semgrep does not look at dependencies. Until the Android build uses dependency locking, the job
# gradle-dependency-graph below submits the fully resolved Gradle graph (including transitive dependencies such as
# Ktor, OkHttp, kotlinx-io, kotlinx-serialization) to GitHub's dependency graph, where Dependabot alerts cover it.
# Once gradle.lockfile files are committed, the trivy fs step scans them without any change here.
#
# Triggers (owner decision 2026-09-23, "be sure that the code is right before merging into main"): a push to ANY
# branch (no path filter, as before; tag pushes do not trigger), a pull request to main (the merge result; also
# covers fork PRs), the weekly schedule (runs on main) and manual runs. Every scanner job runs on a branch push;
# gradle-dependency-graph (contents: write) stays main-only and zap-baseline stays manual-only. With a pull request
# open, one push gives two runs (branch push + pull_request); accepted (docs/07 section 3).
name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC: catches new CVEs in unchanged dependencies
  workflow_dispatch:
    inputs:
      zap_target:
        description: "Optional: URL of a deployed web app or API to run the OWASP ZAP baseline (passive) scan against"
        required: false
        default: ""

# Least privilege: nothing by default; each job asks for what it needs (contents: read, except
# gradle-dependency-graph: contents: write for the Dependency Submission API, main/schedule/manual only; only that
# job's submit/upload phase is non-blocking, via the action's dependency-graph-continue-on-failure input, until the
# dependency graph is confirmed on).
permissions: {}

# One run per ref: a newer push to a branch (or a pull request, ref refs/pull/<n>/merge) cancels the older run;
# runs on main (push, weekly schedule, manual) always finish.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  semgrep:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # --config auto picks rules for the languages found (Java, Kotlin, TypeScript, Dockerfile, YAML). It fetches
      # rules from the Semgrep registry and needs metrics on; no code leaves the runner.
      - name: semgrep scan
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src semgrep/semgrep:1.177.0 \
            semgrep scan --config auto --severity ERROR --error \
            --exclude 'docs/**' --sarif --output semgrep.sarif
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false
      # The CLI in its container avoids gitleaks-action's licence requirement for organisation accounts.
      # Run as the runner's user: git refuses a repository owned by another user ("dubious ownership").
      - name: gitleaks detect
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  trivy:
    name: Dependencies and IaC (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Java dependencies are scanned from a CycloneDX SBOM, not from pom.xml: `trivy fs` resolves parent POMs and
      # BOMs (spring-boot-dependencies, spring-batch-bom, ...) from Maven Central on every run and failed with
      # "429 Too Many Requests". Maven resolves the tree once, from the setup-java cache when it is warm.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Generate backend SBOM (CycloneDX JSON, runtime dependencies)
        id: sbom
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
          test -s target/bom.json

      # Trivy vulnerability DB (about 80 MB) cached per day; Trivy re-downloads it only when the cached copy is stale.
      # The default --db-repository already tries mirror.gcr.io before ghcr.io.
      - name: Cache key for the Trivy DB
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      # Run as the runner's user so actions/cache can read and save what Trivy writes to the cache directory.
      - name: Prepare Trivy cache directory
        run: mkdir -p "$HOME/.cache/trivy"

      # Pinned image version (not the moving trivy-action tags). Blocking: npm lock file vulnerabilities and secrets.
      # --offline-scan: never fetch POMs from remote Maven repositories (Java is covered by the SBOM step below);
      # backend/pom.xml is skipped so Java findings are reported once.
      - name: trivy fs (vulnerabilities and secrets, blocking)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            fs --cache-dir /cache --offline-scan --skip-version-check --no-progress \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs docs --skip-dirs backend/target --skip-files backend/pom.xml \
            --exit-code 1 --format table .

      # Runs even when the fs step found something, so every finding shows up in one run.
      - name: trivy sbom (backend Java dependencies, blocking)
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/backend/target:/sbom:ro" -v "$HOME/.cache/trivy:/cache" "$TRIVY_IMAGE" \
            sbom --cache-dir /cache --skip-version-check --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table /sbom/bom.json

      # Dockerfile checks (backend/Dockerfile, backend/db/Dockerfile). Blocking on HIGH/CRITICAL: both images now
      # run as a non-root USER (DS-0002 fixed at the source, no .trivyignore entry). MEDIUM findings are reported
      # in a second, non-blocking pass so they stay visible.
      - name: trivy config (Dockerfiles, HIGH/CRITICAL blocking)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            config --cache-dir /cache --skip-version-check --skip-dirs docs \
            --severity HIGH,CRITICAL --exit-code 1 .
      - name: trivy config (Dockerfiles, MEDIUM report only)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            config --cache-dir /cache --skip-version-check --skip-dirs docs \
            --severity MEDIUM --exit-code 0 .

      - name: Upload backend SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom-cyclonedx
          path: backend/target/bom.json
          if-no-files-found: ignore
          retention-days: 30

  # Dependency Submission API: needs contents: write, which is why this job is separate, never runs for pull requests
  # (fork PRs get a read-only token, and PR code must not run with a write token) and runs only on main: a push to
  # main, the weekly schedule and a manual run on main; never on a push to another branch (the ref check in its `if`,
  # which matters since the push trigger covers every branch, 2026-09-23). No artifact is uploaded on success
  # (generate-and-submit); results appear as Dependabot alerts. Requires the repository's dependency graph:
  # Settings > Security (Advanced Security) > Dependency graph.
  #
  # Non-blocking until the owner confirms that setting (2026-09-22): the first run on main (8f583af) failed with
  # "HttpError: Dependency submission failed for dependency-graph-reports/security-gradle-dependency-graph.json"
  # although the job had contents: write, most likely because the dependency graph is not enabled. The official
  # action input dependency-graph-continue-on-failure: true makes ONLY the submit/upload phase non-blocking: in
  # gradle/actions v6.3.0 (sources/src/dependency-graph.ts) warnOrFail wraps only dependencyGraph.complete(), i.e.
  # finding the report JSON and POSTing it to the Dependency Submission API; a failure there becomes a ::warning::
  # and the action uploads the graph JSON as a workflow artifact so it is not lost. Everything before it still fails
  # the step: the Gradle build that resolves the dependencies (including a bad dependency-graph-exclude-configurations
  # filter), Gradle provisioning, action setup, checkout and setup-java. No job-level continue-on-error.
  # The preflight step below only warns and names the exact setting to change; the report check after the action
  # warns when no graph JSON was produced (the action then only logs "No dependency graph files found to submit"
  # and passes, which would be a false green).
  # EXIT CRITERION: the job counts as working only when its log/annotations show the notice
  # "Submitted dependency-graph-reports/<file>.json: ..." (a green job alone proves nothing while the input is on).
  # Once a main run shows it, remove dependency-graph-continue-on-failure (back to fail-closed).
  gradle-dependency-graph:
    name: Android dependency graph (Gradle, Dependabot alerts)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Dependency Submission API only; the checkout itself does not keep the token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Read-only preflight (GET, covered by the contents permission): the SBOM export endpoint answers only when the
      # dependency graph is enabled. Never fails the job; it only explains a likely submission failure up front.
      - name: Check that the repository dependency graph is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/dependency-graph/sbom" --silent >/dev/null 2>preflight.err; then
            echo "Dependency graph is enabled for ${REPO}."
          else
            echo "::warning title=Dependency graph not available::The dependency graph API did not answer for ${REPO} ($(tr '\n' ' ' < preflight.err | cut -c1-200)). Gradle dependency submission will fail (non-blocking). Repository owner: enable Settings > Security > Advanced Security > Dependency graph (see https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/configuring-the-dependency-graph), then re-run the Security workflow on main."
          fi
          rm -f preflight.err
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Submit Gradle dependency graph (android/)
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: android
          dependency-graph: generate-and-submit
          # Warn instead of failing when the submit/upload phase fails (see the job comment above). Temporary.
          dependency-graph-continue-on-failure: true
          cache-read-only: true
          # :shared is Kotlin Multiplatform with iOS targets; the force-resolution task would otherwise resolve the
          # Kotlin/Native (klib, commonizer, native bundle) configurations on Linux, which Linux CI never needs and
          # which do not ship in the APK. The filter (full-match regex, gradle/github-dependency-graph-gradle-plugin
          # ResolvedConfigurationFilter) also applies to that task. Android/JVM classpaths stay included.
          # continue-on-failure does NOT cover this filter: it is applied inside the Gradle build, and a Gradle
          # resolution or filter failure still fails this step (red job). Only the later submit/upload phase is
          # non-blocking.
          dependency-graph-exclude-configurations: '(ios|apple|native).*|.*(Native|Klibraries|Cinterop|Klib).*'
      # False-green guard: with no report JSON the action logs "No dependency graph files found to submit" and passes.
      # The default report directory of gradle/actions v6 is dependency-graph-reports/ in the workspace. Never fails
      # the job; a JSON on disk still does not prove submission (look for the "Submitted ..." notice).
      - name: Check that a dependency graph report was produced
        if: always()
        run: |
          if find dependency-graph-reports -name '*.json' -type f 2>/dev/null | grep -q .; then
            echo "Dependency graph report(s):"
            find dependency-graph-reports -name '*.json' -type f
            echo "Submission succeeded only if the previous step shows 'Submitted dependency-graph-reports/...'."
          else
            echo "::warning title=No dependency graph report::No dependency graph JSON was found under dependency-graph-reports/, so nothing was submitted to GitHub and Dependabot alerts do not cover the Android (Gradle) dependencies. Check the 'Submit Gradle dependency graph (android/)' step log (Gradle build, init script, exclude filter)."
          fi

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve the dependency tree
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --no-audit --no-fund; fi
      - name: npm audit (production dependencies, high and critical)
        # Dev-only tooling (Angular CLI, build plugins) is not shipped, so it does not block.
        run: npm audit --audit-level=high --omit=dev

  zap-baseline:
    name: OWASP ZAP baseline (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.zap_target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Passive scan only (no attacks). Third-party action pinned to a full commit SHA (v0.15.0).
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.zap_target }}
          allow_issue_writing: false
          fail_action: false
