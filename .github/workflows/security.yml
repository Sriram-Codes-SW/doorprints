# Security scans (docs/07 section 4, threat model F-22 / SEC-013 / SEC-014). All free and open source.
#
# CodeQL is not used: on private repositories GitHub code scanning needs a paid GitHub Advanced Security licence
# (CON-01 zero cost). The same goes for uploading SARIF to the Security tab, so reports are kept as artifacts.
# If the repository is made public, CodeQL and SARIF upload become free and can be added.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC: catches new CVEs in unchanged dependencies
  workflow_dispatch:
    inputs:
      zap_target:
        description: "Optional: URL of a deployed web app or API to run the OWASP ZAP baseline (passive) scan against"
        required: false
        default: ""

# Least privilege: nothing by default; each job asks for what it needs (only contents: read).
permissions: {}

# Superseded PR runs are cancelled; runs on main (push, weekly schedule) always finish.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: SAST (Semgrep OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # --config auto picks rules for the languages found (Java, Kotlin, TypeScript, Dockerfile, YAML). It fetches
      # rules from the Semgrep registry and needs metrics on; no code leaves the runner.
      - name: semgrep scan
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src semgrep/semgrep:1.177.0 \
            semgrep scan --config auto --severity ERROR --error \
            --exclude 'docs/**' --sarif --output semgrep.sarif
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false
      # The CLI in its container avoids gitleaks-action's licence requirement for organisation accounts.
      # Run as the runner's user: git refuses a repository owned by another user ("dubious ownership").
      - name: gitleaks detect
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  trivy:
    name: Dependencies and IaC (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Java dependencies are scanned from a CycloneDX SBOM, not from pom.xml: `trivy fs` resolves parent POMs and
      # BOMs (spring-boot-dependencies, spring-batch-bom, ...) from Maven Central on every run and failed with
      # "429 Too Many Requests". Maven resolves the tree once, from the setup-java cache when it is warm.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Generate backend SBOM (CycloneDX JSON, runtime dependencies)
        id: sbom
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
          test -s target/bom.json

      # Trivy vulnerability DB (about 80 MB) cached per day; Trivy re-downloads it only when the cached copy is stale.
      # The default --db-repository already tries mirror.gcr.io before ghcr.io.
      - name: Cache key for the Trivy DB
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      # Run as the runner's user so actions/cache can read and save what Trivy writes to the cache directory.
      - name: Prepare Trivy cache directory
        run: mkdir -p "$HOME/.cache/trivy"

      # Pinned image version (not the moving trivy-action tags). Blocking: npm lock file vulnerabilities and secrets.
      # --offline-scan: never fetch POMs from remote Maven repositories (Java is covered by the SBOM step below);
      # backend/pom.xml is skipped so Java findings are reported once.
      - name: trivy fs (vulnerabilities and secrets, blocking)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            fs --cache-dir /cache --offline-scan --skip-version-check --no-progress \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs docs --skip-dirs backend/target --skip-files backend/pom.xml \
            --exit-code 1 --format table .

      # Runs even when the fs step found something, so every finding shows up in one run.
      - name: trivy sbom (backend Java dependencies, blocking)
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/backend/target:/sbom:ro" -v "$HOME/.cache/trivy:/cache" "$TRIVY_IMAGE" \
            sbom --cache-dir /cache --skip-version-check --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table /sbom/bom.json

      # Dockerfile checks (backend/Dockerfile, backend/db/Dockerfile). Blocking on HIGH/CRITICAL: both images now
      # run as a non-root USER (DS-0002 fixed at the source, no .trivyignore entry). MEDIUM findings are reported
      # in a second, non-blocking pass so they stay visible.
      - name: trivy config (Dockerfiles, HIGH/CRITICAL blocking)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            config --cache-dir /cache --skip-version-check --skip-dirs docs \
            --severity HIGH,CRITICAL --exit-code 1 .
      - name: trivy config (Dockerfiles, MEDIUM report only)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "$HOME/.cache/trivy:/cache" -w /src "$TRIVY_IMAGE" \
            config --cache-dir /cache --skip-version-check --skip-dirs docs \
            --severity MEDIUM --exit-code 0 .

      - name: Upload backend SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom-cyclonedx
          path: backend/target/bom.json
          if-no-files-found: ignore
          retention-days: 30

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve the dependency tree
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --no-audit --no-fund; fi
      - name: npm audit (production dependencies, high and critical)
        # Dev-only tooling (Angular CLI, build plugins) is not shipped, so it does not block.
        run: npm audit --audit-level=high --omit=dev

  zap-baseline:
    name: OWASP ZAP baseline (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.zap_target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Passive scan only (no attacks). Third-party action pinned to a full commit SHA (v0.15.0).
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ inputs.zap_target }}
          allow_issue_writing: false
          fail_action: false
