# The "always report" twin of android-emulator.yml (docs/07 section 3): the same workflow and job names, triggered by
# the complement of its paths (paths-ignore mirrors them exactly), succeeding at once, so the required checks report
# on a pull request that touches nothing under android/. See android-required.yml.
name: Android emulator

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-emulator.yml"

permissions: {}

jobs:
  emulator:
    name: Smoke tests on an emulator (API ${{ matrix.api }})
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    strategy:
      matrix:
        api: [26, 34, 36]
    steps:
      - run: echo "No Android input changed in this pull request; android-emulator.yml did not run."
