# Backend: compile, unit + integration tests against a real PostGIS + pgvector database.
# docs/07-secure-build-and-deploy.md section 3 describes the pipeline and its security controls.
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs (only contents: read).
permissions: {}

# Superseded PR runs are cancelled; runs on main always finish.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: mvn verify (JDK 25, PostGIS 18 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Service containers cannot be built from a Dockerfile, so build backend/db and run it by hand.
      - name: Build database image (PostGIS + pgvector)
        run: docker build -t house-hunt-db:ci backend/db

      - name: Start database
        run: |
          docker run -d --name db \
            -e POSTGRES_DB=househunt -e POSTGRES_USER=househunt -e POSTGRES_PASSWORD=househunt \
            -p 127.0.0.1:5432:5432 house-hunt-db:ci
          # Wait for the final server on TCP (the image's init phase only listens on the unix socket).
          for i in $(seq 1 60); do
            if docker exec db pg_isready -h 127.0.0.1 -U househunt -d househunt >/dev/null 2>&1; then
              echo "database ready"; exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/househunt
          DB_USER: househunt
          DB_PASSWORD: househunt
          # Tests set app.api-key themselves; AI and MCP stay off (their unit tests need no provider).
          APP_AI_ENABLED: "false"
          APP_MCP_ENABLED: "false"
        run: mvn -B -ntp verify

      # Supply chain record: CycloneDX SBOM of the runtime dependencies (the same file security.yml scans with
      # `trivy sbom`). Dependencies are already in the local Maven repository after verify.
      - name: Generate SBOM (CycloneDX JSON)
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom-cyclonedx
          path: backend/target/bom.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Database logs
        if: failure()
        run: docker logs db | tail -200

  image:
    name: Build container image
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: docker build (runs as UID 10001, see backend/Dockerfile)
        run: docker build -t house-hunt-api:${{ github.sha }} backend
      - name: Check the image does not run as root
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' house-hunt-api:${{ github.sha }})
          echo "image user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
