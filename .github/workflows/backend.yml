# Backend: compile, unit + integration tests against a real PostGIS + pgvector database.
# docs/07-secure-build-and-deploy.md section 3 describes the pipeline and its security controls.
name: Backend

# Path filters cover every file `mvn verify` reads, not only backend/**: a test that reads a file outside the module
# would otherwise be able to break main without any workflow running (near-miss in commit feb0294, where a golden-set
# edit alone would have skipped this workflow). Checked 2026-09-22 by grepping backend/src/test for repoFile(, Path.of(
# and "../": the readers are GoldenSet, CanonicalSample and BackupParityTest, each named on its entries below.
# Whoever adds such a test adds its path here.
# The two lists below are identical and must stay that way (GitHub Actions does not support YAML anchors).
#
# Triggers: a push to main that touches one of the paths below, a pull request to main (tests the merge result; also
# covers fork PRs, which never get secrets) and manual runs; tag pushes do not trigger. From 2026-09-23 to
# 2026-09-29 every branch push ran it too (owner decision "be sure that the code is right before merging into
# main"), which gave two runs per push with a pull request open; since the delivery-speed review of 2026-09-29
# (docs/14 §7) the pull request run alone is the pre-merge signal, so a branch gets CI once its pull request is open
# (a draft is fine). Nothing in this workflow deploys, signs or pushes an image.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # EvalScorerTest (a plain unit test in `mvn verify`) loads docs/ai/evals/golden-set.json through
      # GoldenSet.locate() -> "../docs/ai/evals/golden-set.json": editing the golden set can turn this workflow red.
      - "docs/ai/evals/**"
      # The export/backup contract sample. Load-bearing: CanonicalSample (used by BackupMapperTest and BackupApiTest,
      # both in `mvn verify`) walks up to docs/schemas/backup-sample.json, so editing the shared format sample alone
      # can turn this workflow red.
      - "docs/schemas/**"
      # BackupParityTest.theShippedConfigurationUsesTheSameNumber reads the MAX_IMPORT_BYTES default here.
      - "docker-compose.yml"
      # BackupParityTest.theClientReadersUseTheSameNumber reads maxDataJsonBytes here.
      - "web/src/app/export/backup-export.ts"
      # BackupParityTest.theWebGoldenIsTheCanonicalSample compares golden/backup.golden.ts byte for byte with the sample.
      - "web/src/app/export/golden/**"
      # BackupParityTest.theClientReadersUseTheSameNumber reads MAX_DATA_JSON_BYTES here (Android :shared).
      - "android/shared/src/commonMain/kotlin/app/doorprints/shared/export/Backup.kt"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/ai/evals/**"
      - "docs/schemas/**"
      - "docker-compose.yml"
      - "web/src/app/export/backup-export.ts"
      - "web/src/app/export/golden/**"
      - "android/shared/src/commonMain/kotlin/app/doorprints/shared/export/Backup.kt"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs (only contents: read).
permissions: {}

# One run per ref: a newer push to a branch (or a pull request, ref refs/pull/<n>/merge) cancels the older run;
# runs on main always finish.
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: mvn verify (JDK 25, PostGIS 18 + pgvector)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Service containers cannot be built from a Dockerfile, so build backend/db and run it by hand.
      - name: Build database image (PostGIS + pgvector)
        run: docker build -t doorprints-db:ci backend/db

      - name: Start database
        run: |
          docker run -d --name db \
            -e POSTGRES_DB=doorprints -e POSTGRES_USER=doorprints -e POSTGRES_PASSWORD=doorprints \
            -p 127.0.0.1:5432:5432 doorprints-db:ci
          # Wait for the final server on TCP (the image's init phase only listens on the unix socket).
          for _ in $(seq 1 60); do
            if docker exec db pg_isready -h 127.0.0.1 -U doorprints -d doorprints >/dev/null 2>&1; then
              echo "database ready"; exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: mvn verify
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/doorprints
          DB_USER: doorprints
          DB_PASSWORD: doorprints
          # Tests set app.api-key themselves; AI and MCP stay off (their unit tests need no provider).
          APP_AI_ENABLED: "false"
          APP_MCP_ENABLED: "false"
        run: mvn -B -ntp verify

      # Supply chain record: CycloneDX SBOM of the runtime dependencies (the same file security.yml scans with
      # `trivy sbom`). Dependencies are already in the local Maven repository after verify.
      - name: Generate SBOM (CycloneDX JSON)
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom-cyclonedx
          path: backend/target/bom.json
          if-no-files-found: error
          retention-days: 30

      # The API's OpenAPI description, written by OpenApiSpecTest (springdoc in test scope only), for the ZAP API scan in
      # the image job below.
      - name: Upload the OpenAPI description
        uses: actions/upload-artifact@v7
        with:
          name: backend-openapi
          path: backend/target/openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Database logs
        if: failure()
        run: docker logs db | tail -200

  # Build-only check of backend/Dockerfile (no registry login, no push, contents: read): runs on a push to main, on a
  # manual run and, since 2026-09-29, on a pull request from a branch of this repository (before that the branch push
  # of the same commit built it; branch pushes no longer run CI), so a broken Dockerfile or a root USER is caught
  # before the merge. Not for a fork's pull request (its code must not run the ZAP scan with this repository's
  # settings; Semgrep and the tests still cover it). Since 2026-09-29 also the release security gate's checks on the
  # built image (S4b-SEC-1, docs/06 section 11): Trivy on the image (TC-S-05) and the OWASP ZAP API scan of the
  # running API (TC-S-04), both blocking.
  image:
    name: Build container image
    needs: verify
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: docker build (runs as UID 10001, see backend/Dockerfile)
        run: docker build -t doorprints-api:${{ github.sha }} backend
      - name: Check the image does not run as root
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' doorprints-api:${{ github.sha }})
          echo "image user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

      # TC-S-05: the image as it would ship (OS packages, the JRE, the jar), HIGH/CRITICAL with a fix available.
      # The Trivy DB cache is shared with security.yml's key scheme (one download per day).
      - name: Cache key for the Trivy DB
        id: trivy-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: trivy image (HIGH/CRITICAL, blocking)
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker save doorprints-api:${{ github.sha }} -o "$RUNNER_TEMP/api-image.tar"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP:/in:ro" -v "$HOME/.cache/trivy:/cache" "$TRIVY_IMAGE" \
            image --cache-dir /cache --skip-version-check --no-progress --input /in/api-image.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table

      # TC-S-04: the running API, attacked through every path of its OpenAPI description with the key (backend/ci/
      # api-scan.sh: the image and a fresh database on a private network; fails on any High-risk alert).
      - uses: actions/download-artifact@v8
        with:
          name: backend-openapi
          path: ${{ runner.temp }}/openapi
      - name: Build database image (PostGIS + pgvector)
        run: docker build -t doorprints-db:ci backend/db
      - name: OWASP ZAP API scan (blocking on High)
        run: |
          chmod +x backend/ci/api-scan.sh
          backend/ci/api-scan.sh doorprints-api:${{ github.sha }} doorprints-db:ci \
            "$RUNNER_TEMP/openapi/openapi.json" "$RUNNER_TEMP/zap"
      - name: Upload the ZAP report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-zap-api-scan
          path: ${{ runner.temp }}/zap
          if-no-files-found: ignore
          retention-days: 30
