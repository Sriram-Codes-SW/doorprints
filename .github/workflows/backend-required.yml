# The "always report" twin of backend.yml (docs/07 section 3): the same workflow and job names, triggered by the
# complement of its paths (paths-ignore mirrors them exactly), succeeding at once, so the required checks report on
# a pull request that touches no backend input. See android-required.yml.
name: Backend

on:
  pull_request:
    paths-ignore:
      - "backend/**"
      - "docs/ai/evals/**"
      - "docs/schemas/**"
      - "docker-compose.yml"
      - "web/src/app/export/backup-export.ts"
      - "web/src/app/export/golden/**"
      - "android/shared/src/commonMain/kotlin/app/doorprints/shared/export/Backup.kt"
      - ".github/workflows/backend.yml"

permissions: {}

jobs:
  verify:
    name: mvn verify (JDK 25, PostGIS 18 + pgvector)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No backend input changed in this pull request; backend.yml did not run."
  image:
    name: Build container image
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No backend input changed in this pull request; backend.yml did not run."
