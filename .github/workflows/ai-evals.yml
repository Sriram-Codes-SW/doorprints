# AI evals: runs the golden set (docs/ai/evals/golden-set.json) against a real model and publishes a scorecard.
# Manual only: it spends provider quota / credit and model answers are not deterministic, so it never runs on push/PR.
# Harness: backend/src/test/java/app/doorprints/server/ai/eval/GoldenSetEvalTest.java; metrics: docs/ai/ai-design.md section 8.
# Providers (input `provider`, docs/ai/ai-design.md 2.1 and 3.3):
#   vertex: Google Cloud Vertex AI via Workload Identity Federation, no stored key. Needs repository secrets
#     GCP_WIF_PROVIDER (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>) and
#     GCP_SA_EMAIL (the eval service account, roles/aiplatform.user only), plus GCP_PROJECT_ID and optionally
#     GCP_LOCATION as repository variables (or secrets). Setup: docs/ai/vertex-setup.md.
#   aistudio (default until the owner has finished docs/ai/vertex-setup.md steps 1-8 and step 10 has confirmed the
#     trial credit is applied; then change the default below to vertex): Gemini Developer API; needs the repository
#     secret AI_API_KEY (https://aistudio.google.com/apikey).
# Quota-aware: on HTTP 429 / RESOURCE_EXHAUSTED the harness stops, the scorecard says
# "STOPPED: provider quota exhausted" and the job fails with an explicit error annotation.
# Ownership: the workflow file belongs to DevSecOps (owner of .github/**, adopted 2026-09-22, reviewed against the
# repo's CI rules: manual trigger only, permissions {} with job-level contents: read, persist-credentials: false,
# untrusted inputs passed through env and validated, never interpolated into scripts). The eval harness and golden
# set belong to the AI team; changes to either side go through the other team's review.
# 2026-09-22 (AI team, PO decision "Vertex AI as active provider"): provider input, Vertex AI auth through
# google-github-actions/auth@v3 (id-token: write on this job only, used only when provider=vertex), model inputs,
# quota-stop annotation.
# DevSecOps review of the 2026-09-22 AI-team change: DONE 2026-09-22 (Claude, DevSecOps team), approved with the
# changes below, which are applied in this file:
#   - id-token: write stays job-level (GitHub has no step-level permissions). It is acceptable because the workflow
#     is manual only (users with write access) and the token is useless outside the WIF provider's attribute
#     condition. The Maven step runs with the OIDC request variables removed (env -u ACTIONS_ID_TOKEN_REQUEST_URL
#     -u ACTIONS_ID_TOKEN_REQUEST_TOKEN), but that is defence in depth only, NOT isolation: env -u only stops code
#     from reading the request variables directly. The WIF credential file that google-github-actions/auth writes
#     to the workspace (GOOGLE_APPLICATION_CREDENTIALS, credential_source.url and credential_source.headers) holds
#     the same OIDC request URL and bearer token, so any Maven plugin or test code in that step can still obtain
#     GitHub OIDC tokens while the job runs. Residual risk, accepted: the real controls are the manual-only trigger
#     (write access), the WIF attribute condition (repository plus refs/heads/main, owner action below), the eval
#     service account having only roles/aiplatform.user, and cleanup_credentials (default true, not overridden
#     here) deleting the file when the job ends.
#   - google-github-actions/auth is a third-party action, so it is pinned to a full commit SHA (v3.0.0), like
#     zaproxy/action-baseline in security.yml; Dependabot (github-actions ecosystem) keeps the SHA current.
#   - AI_API_KEY is exported only for provider=aistudio (checked, correct); the WIF credential file written to the
#     workspace is not uploaded (both upload steps only take backend/target paths) and is removed by the action.
#   - Required on the Google side (owner, docs/ai/vertex-setup.md): use the stricter attribute condition that also
#     pins the ref, assertion.repository == 'Sriram-Codes-SW/doorprints' && assertion.ref == 'refs/heads/main',
#     now that the repository is public. Tracked as an open DevSecOps item until the owner confirms it.
#   The matching sign-off line in docs/ai/ai-design.md section 14 is for the AI/Docs team to add.
# Firebase (DevSecOps, 2026-09-23): the Workload Identity pool this workflow uses (doorprints-ai project, secrets
#   GCP_WIF_PROVIDER / GCP_SA_EMAIL) is NOT trusted for Firebase Hosting and must never be granted any role in the
#   Firebase project `doorprints`. The web deploy (web.yml, job deploy-firebase) has its own pool `github` and
#   provider `github-web-deploy` inside the Firebase project, whose attribute condition accepts only web.yml on
#   main (push or workflow_dispatch); a token from this workflow is refused there. Reason: this job runs Maven and
#   test code while OIDC tokens can be obtained (see above), so it must not be able to replace the public website.
# 2026-10-07 (S4b-BL-153, optional): the suite `own-provider` (job below) runs the same golden set through the website's own
#   TypeScript adapters (web/src/app/core/ai/, ADR-35) against the provider the owner picks in the inputs ai_kind,
#   ai_base_url and ai_model (or the repository variables AI_EVAL_BASE_URL and AI_EVAL_MODEL), with the repository secret
#   AI_EVAL_API_KEY. The owner may never set the secret: the job then prints "skipped: no key" and succeeds without
#   installing anything. No model name or key is in the repository. Free providers and synthetic data only (PRV-022).
# 2026-10-08 (S4b-BL-175, keyless): the suite `local-model` (job below) installs Ollama on the runner from the official release,
#   pinned by version and by the sha256 the release publishes (no `curl | sh`), pulls a small model and runs the same golden
#   set through the website's openai-compatible adapter against http://127.0.0.1:11434/v1 with no key. It exists because the
#   only real key the owner has is Gemini's: this exercises the openai-compatible kind (ladder, strict schema, fences, errors)
#   against a real model server for nothing. No secret, no new permission, no paid service. Its first real run is CI's
#   (docs/ai/ai-design.md 8.1). llama.cpp's server is a documented follow-up (it needs its own pinned release and a pinned GGUF
#   file); there is no `local_server` input until it exists.
name: AI evals

on:
  workflow_dispatch:
    inputs:
      suites:
        description: What to run. golden-set = the server's eval (below); on-device = one real Extract, Ask and Plan through the phones' and the website's own-key AI (needs AI_API_KEY whatever the provider); own-provider = the golden set through the website's adapters and the provider chosen below (optional; needs AI_EVAL_API_KEY, else "skipped - no key"); local-model = the golden set through the website's openai-compatible adapter against a small model that Ollama runs on the runner (no key, no secret, free)
        type: choice
        default: golden-set,on-device
        options:
          - golden-set,on-device
          - golden-set
          - on-device
          - own-provider
          - local-model
      types:
        description: Case types to run
        type: choice
        default: extract,ask,plan
        options:
          - extract,ask,plan
          - extract,ask
          - extract
          - ask
          - plan
      delay_ms:
        description: Pause between cases in ms (free-tier requests-per-minute limits)
        type: string
        default: "4000"
      provider:
        description: Model provider. aistudio = AI_API_KEY secret. vertex = Google Cloud Vertex AI; needs docs/ai/vertex-setup.md steps 1-8 done first (secrets GCP_WIF_PROVIDER, GCP_SA_EMAIL, variable GCP_PROJECT_ID)
        type: choice
        default: aistudio
        options:
          - aistudio
          - vertex
      thinking_level:
        description: "golden-set only: the model's thinking level (S4b-BL-197). default = the model's own, unchanged. The others set SPRING_AI_GOOGLE_GENAI_CHAT_THINKING_LEVEL (vertex) or SPRING_AI_OPENAI_CHAT_REASONING_EFFORT (aistudio) for the server; the scorecard header shows it"
        type: choice
        default: default
        options:
          - default
          - minimal
          - low
          - medium
          - high
      chat_model:
        description: Chat model override, e.g. gemini-3.5-flash-lite (empty = AI_CHAT_MODEL default from application.yml)
        type: string
        default: ""
      embedding_model:
        description: Embedding model override, e.g. gemini-embedding-001 (empty = default gemini-embedding-2; must give 768 dims)
        type: string
        default: ""
      ai_kind:
        description: "own-provider only: the kind of provider (docs/03 ADR-35). Its key is the repository secret AI_EVAL_API_KEY; the gemini kind uses AI_API_KEY first"
        type: choice
        default: openai-compatible
        options:
          - openai-compatible
          - anthropic
          - gemini
      ai_base_url:
        description: "own-provider only: base URL of an OpenAI-compatible provider, e.g. https://api.groq.com/openai/v1 (empty = repository variable AI_EVAL_BASE_URL; not used for gemini)"
        type: string
        default: ""
      ai_model:
        description: "own-provider only: model name (empty = repository variable AI_EVAL_MODEL; not used for gemini)"
        type: string
        default: ""
      local_model:
        description: "local-model only: the Ollama library tag to pull. The default qwen2.5:0.5b (about 400 MB) is the one the 3-core runner answers in time; qwen2.5:1.5b (about 1 GB) did not (S4b-BL-190). Keep it under about 2.5 GB, the runner has no GPU. Tip: choose types = extract for a first run"
        type: string
        default: "qwen2.5:0.5b"

# Least privilege: nothing by default; the job only reads the repository.
permissions: {}

# One eval at a time (they share the provider quota); never cancel a running one.
concurrency:
  group: ai-evals
  cancel-in-progress: false

jobs:
  eval:
    name: Golden-set eval (JDK 25, PostGIS 18 + pgvector, real model)
    if: contains(inputs.suites, 'golden-set')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Only for Workload Identity Federation (google-github-actions/auth, provider=vertex): lets the job request a
      # GitHub OIDC token, which Google exchanges for a short-lived service-account token. The aistudio path never
      # requests one.
      id-token: write
    steps:
      - name: Validate inputs
        env:
          DELAY_MS: ${{ inputs.delay_ms }}
          PROVIDER: ${{ inputs.provider }}
          THINKING_LEVEL: ${{ inputs.thinking_level }}
          CHAT_MODEL_INPUT: ${{ inputs.chat_model }}
          EMBEDDING_MODEL_INPUT: ${{ inputs.embedding_model }}
        run: |
          if ! [[ "$DELAY_MS" =~ ^[0-9]{1,6}$ ]]; then
            echo "::error::delay_ms must be a whole number of milliseconds"
            exit 1
          fi
          if [ "$PROVIDER" != "vertex" ] && [ "$PROVIDER" != "aistudio" ]; then
            echo "::error::provider must be vertex or aistudio"
            exit 1
          fi
          if ! [[ "$THINKING_LEVEL" =~ ^(default|minimal|low|medium|high)$ ]]; then
            echo "::error::thinking_level must be default, minimal, low, medium or high"
            exit 1
          fi
          for m in "$CHAT_MODEL_INPUT" "$EMBEDDING_MODEL_INPUT"; do
            if [ -n "$m" ] && ! [[ "$m" =~ ^[a-z0-9][a-z0-9.-]{0,63}$ ]]; then
              echo "::error::model names may only contain lower-case letters, digits, dots and hyphens"
              exit 1
            fi
          done

      # Vertex AI is paid from the Google Cloud trial credit, which ends on 22 Dec 2026 (docs/08 10.4). A rerun by anyone
      # with write access must not be able to spend beyond it: Vertex needs the repository variable VERTEX_EVAL_ENABLED=true
      # (the owner sets it for a run and deletes it afterwards) and is refused from 15 Dec 2026 whatever the variable says.
      - name: Vertex AI trial guard
        if: ${{ inputs.provider == 'vertex' }}
        env:
          VERTEX_EVAL_ENABLED: ${{ vars.VERTEX_EVAL_ENABLED }}
        run: |
          if [ "$VERTEX_EVAL_ENABLED" != "true" ]; then
            echo "::error::Vertex AI evals are switched off. The owner turns them on with the repository variable VERTEX_EVAL_ENABLED=true (Settings > Secrets and variables > Actions > Variables) while the Google Cloud trial credit lasts. Or run with provider=aistudio."
            exit 1
          fi
          if [[ "$(date -u +%F)" > "2026-12-14" ]]; then
            echo "::error::Vertex AI evals are closed from 2026-12-15: the Google Cloud trial credit ends on 2026-12-22 (docs/08-operations-runbook.md 10.4). Run with provider=aistudio."
            exit 1
          fi

      - name: Check the provider's secrets are set
        env:
          PROVIDER: ${{ inputs.provider }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          where="Settings > Secrets and variables > Actions"
          if [ "$PROVIDER" = "aistudio" ]; then
            if [ -z "$AI_API_KEY" ]; then
              echo "::error::Repository secret AI_API_KEY is not set ($where). Without it the eval test is skipped."
              exit 1
            fi
          else
            missing=""
            [ -z "$GCP_WIF_PROVIDER" ] && missing="$missing GCP_WIF_PROVIDER(secret)"
            [ -z "$GCP_SA_EMAIL" ] && missing="$missing GCP_SA_EMAIL(secret)"
            [ -z "$GCP_PROJECT_ID" ] && missing="$missing GCP_PROJECT_ID(variable)"
            if [ -n "$missing" ]; then
              echo "::error::Vertex AI eval needs:$missing ($where; see docs/ai/vertex-setup.md). Or run with provider=aistudio."
              exit 1
            fi
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Workload Identity Federation: no service-account key exists anywhere. Writes a short-lived external-account
      # credential file (removed again at the end of the job) and exports GOOGLE_APPLICATION_CREDENTIALS, which the
      # app's Application Default Credentials lookup reads. Must run after checkout (the file lives in the workspace).
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ inputs.provider == 'vertex' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}

      # Same database as backend.yml: service containers cannot be built from a Dockerfile, so build backend/db
      # (postgis/postgis + pgvector) and run it by hand. A fresh database per run keeps retrieval scores comparable.
      - name: Build database image (PostGIS + pgvector)
        run: docker build -t doorprints-db:ci backend/db

      - name: Start database
        run: |
          docker run -d --name db \
            -e POSTGRES_DB=doorprints -e POSTGRES_USER=doorprints -e POSTGRES_PASSWORD=doorprints \
            -p 127.0.0.1:5432:5432 doorprints-db:ci
          # Wait for the final server on TCP (the image's init phase only listens on the unix socket).
          for _ in $(seq 1 60); do
            if docker exec db pg_isready -h 127.0.0.1 -U doorprints -d doorprints >/dev/null 2>&1; then
              echo "database ready"; exit 0
            fi
            sleep 2
          done
          docker logs db
          exit 1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run GoldenSetEvalTest
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/doorprints
          DB_USER: doorprints
          DB_PASSWORD: doorprints
          APP_AI_ENABLED: "true"
          APP_MCP_ENABLED: "false"
          # DEBUG for one class only, RagService: one line per ask with the retrieved house ids, so a failed case shows
          # whether the house was retrieved (S4b-BL-194). Ids only. SPRING_APPLICATION_JSON because an env-var name
          # binds in lower case (a logger name is case-sensitive) and a package name would also raise HouseIndexer.
          SPRING_APPLICATION_JSON: '{"logging":{"level":{"app.doorprints.server.ai.rag.RagService":"DEBUG"}}}'
          AI_PROVIDER: ${{ inputs.provider }}
          # The key is only handed to the aistudio path; Vertex AI uses the federated credentials instead.
          AI_API_KEY: ${{ inputs.provider == 'aistudio' && secrets.AI_API_KEY || '' }}
          GCP_PROJECT_ID: ${{ inputs.provider == 'vertex' && (vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID) || '' }}
          GCP_LOCATION_SETTING: ${{ vars.GCP_LOCATION || secrets.GCP_LOCATION }}
          AI_VERTEX_EMBEDDING_LOCATION: ${{ vars.AI_VERTEX_EMBEDDING_LOCATION }}
          AI_EVAL_TYPES: ${{ inputs.types }}
          AI_EVAL_DELAY_MS: ${{ inputs.delay_ms }}
          THINKING_LEVEL: ${{ inputs.thinking_level }}
          CHAT_MODEL_INPUT: ${{ inputs.chat_model }}
          EMBEDDING_MODEL_INPUT: ${{ inputs.embedding_model }}
        run: |
          # Only override when set: an empty value would replace the application.yml default.
          if [ -n "$CHAT_MODEL_INPUT" ]; then export AI_CHAT_MODEL="$CHAT_MODEL_INPUT"; fi
          if [ -n "$EMBEDDING_MODEL_INPUT" ]; then export AI_EMBEDDING_MODEL="$EMBEDDING_MODEL_INPUT"; fi
          # Thinking level (S4b-BL-197): only when chosen; "default" leaves the model's own level. Spring Boot's relaxed
          # binding reads these environment variables straight into spring.ai.google.genai.chat.thinking-level (an enum,
          # MINIMAL | LOW | MEDIUM | HIGH, upper case) and spring.ai.openai.chat.reasoning-effort (a string, lower case);
          # no SPRING_APPLICATION_JSON is needed, so it cannot clash with one set for another purpose. The scorecard
          # header ("Thinking level") reads the same two properties back from the running server.
          if [ "$THINKING_LEVEL" != "default" ]; then
            if [ "$AI_PROVIDER" = "vertex" ]; then
              SPRING_AI_GOOGLE_GENAI_CHAT_THINKING_LEVEL="$(printf '%s' "$THINKING_LEVEL" | tr '[:lower:]' '[:upper:]')"
              export SPRING_AI_GOOGLE_GENAI_CHAT_THINKING_LEVEL
            else
              export SPRING_AI_OPENAI_CHAT_REASONING_EFFORT="$THINKING_LEVEL"
            fi
          fi
          if [ -n "$GCP_LOCATION_SETTING" ]; then export GCP_LOCATION="$GCP_LOCATION_SETTING"; fi
          if [ -z "$AI_VERTEX_EMBEDDING_LOCATION" ]; then unset AI_VERTEX_EMBEDDING_LOCATION; fi
          # No -Dsurefire.failIfNoSpecifiedTests=false: if the test class is renamed or removed, Surefire fails the
          # run ("No tests matching pattern") instead of passing green with no scorecard.
          # Defence in depth only: env -u only stops code from reading the OIDC request variables directly. The WIF
          # credential file (credential_source.url and headers) contains the same request URL and bearer token, so
          # code in this step (third-party plugins, tests) can still obtain OIDC tokens while the job runs; Vertex
          # auth keeps working because the Google auth library takes both from that file. The real controls are the
          # manual-only trigger, the WIF attribute condition (repository + refs/heads/main), the eval SA having only
          # roles/aiplatform.user, and cleanup_credentials removing the file after the job (see header).
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN mvn -B -ntp test -Dtest=GoldenSetEvalTest

      - name: Report a provider quota stop
        if: always()
        run: |
          if [ -f backend/target/ai-eval-report.md ] && grep -q "STOPPED: provider quota exhausted" backend/target/ai-eval-report.md; then
            echo "::error title=AI eval STOPPED::Provider quota exhausted (HTTP 429 / RESOURCE_EXHAUSTED). The remaining cases were not run. Wait for the per-minute/daily quota to reset, check Billing, or lower the load (types, delay_ms), then re-run."
            exit 1
          fi

      - name: Publish scorecard to the job summary
        if: always()
        run: |
          if [ -f backend/target/ai-eval-report.md ]; then
            cat backend/target/ai-eval-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scorecard was written (the test was skipped or failed before the first case)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-report
          path: backend/target/ai-eval-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Database logs
        if: failure()
        run: docker logs db | tail -200

  # On-device AI with the person's own key (docs/03 §13.1, ADR-26; docs/06 TC-U-88): the phones' OnDeviceAi (JVM test on
  # the Android HTTP stack) and the website's OnDeviceAiService (Vitest, fetch) each make one real Extract, Ask and Plan
  # call to Gemini with AI_API_KEY and check that no saved contact name or phone number is in what they send. Both tests
  # skip themselves without DOORPRINTS_LIVE_GEMINI_KEY, so the normal Android and Web workflows never call Google. Runs
  # after the golden set (whatever its result) so the two never share the per-minute quota. No id-token: this job
  # needs only the key, which is passed to the test step alone.
  on-device:
    name: On-device AI, real key (phones and website)
    needs: eval
    if: always() && contains(inputs.suites, 'on-device')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check AI_API_KEY is set
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::Repository secret AI_API_KEY is not set (Settings > Secrets and variables > Actions). The on-device tests need a Gemini Developer API key."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper JAR checksum (protects against a tampered gradle-wrapper.jar).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Phones (Kotlin OnDeviceAi, real Gemini)
        working-directory: android
        env:
          DOORPRINTS_LIVE_GEMINI_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:testAndroidHostTest --tests 'app.doorprints.shared.ai.OnDeviceAiLiveTest' --rerun -i \
            | grep -E '^(Extract|Ask|Plan):|OnDeviceAiLiveTest' || true
          report=shared/build/test-results/testAndroidHostTest/TEST-app.doorprints.shared.ai.OnDeviceAiLiveTest.xml
          test -f "$report" || { echo "::error::The phones' live test did not run"; exit 1; }
          if grep -q '<skipped' "$report"; then echo "::error::The phones' live test was skipped (no key reached it)"; exit 1; fi
          if grep -q '<failure' "$report"; then
            grep -o 'message="[^"]*"' "$report" | head -3
            echo "::error::The phones' live test failed (see the report artifact)"; exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Website (TypeScript OnDeviceAiService, real Gemini)
        working-directory: web
        env:
          DOORPRINTS_LIVE_GEMINI_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          npm ci --no-audit --no-fund
          status=0
          npx ng test --watch=false --include src/app/core/ai/on-device-ai.live.spec.ts > live.log 2>&1 || status=$?
          sed 's/\x1b\[[0-9;]*m//g' live.log > live.txt
          grep -E '^(Extract|Ask|Plan):|Tests |Error' live.txt || true
          if grep -q 'skipped' live.txt; then echo "::error::The website's live test was skipped (no key reached it)"; exit 1; fi
          if [ "$status" -ne 0 ] || ! grep -qE 'Tests +1 passed' live.txt; then
            echo "::error::The website's live test failed"; exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: on-device-live-reports
          path: android/shared/build/test-results/testAndroidHostTest/TEST-app.doorprints.shared.ai.OnDeviceAiLiveTest.xml
          if-no-files-found: ignore
          retention-days: 7

  # The golden set through the website's adapters and a provider of the owner's choice (S4b-BL-153; docs/06 TC-AI-23;
  # docs/ai/ai-design.md 8.4). Optional: without the secret AI_EVAL_API_KEY it says "skipped: no key", installs nothing
  # and succeeds. Runs ai-provider.live.spec.ts (Vitest) with the key in the environment of that one step; npm ci runs
  # before, without it. Only the manual trigger reaches it (this file has no pull_request or push trigger). Read-only
  # token, no id-token. Reported, not gating: the summary lists what passed; the job fails only when the setting is
  # wrong or no case got an answer.
  own-provider:
    name: Golden set through the chosen provider (website adapters, optional)
    if: inputs.suites == 'own-provider'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Skip cleanly without a key
        id: key
        env:
          # The Gemini kind reuses the repository secret AI_API_KEY the other suites already use.
          AI_EVAL_API_KEY: ${{ (inputs.ai_kind == 'gemini' && secrets.AI_API_KEY) || secrets.AI_EVAL_API_KEY || '' }}
        run: |
          if [ -z "$AI_EVAL_API_KEY" ]; then
            echo "skipped: no key" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.key.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the website's packages (no key in this step)
        if: steps.key.outputs.run == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run the golden set
        if: steps.key.outputs.run == 'true'
        working-directory: web
        env:
          DOORPRINTS_EVAL_KEY: ${{ (inputs.ai_kind == 'gemini' && secrets.AI_API_KEY) || secrets.AI_EVAL_API_KEY || '' }}
          AI_EVAL_KIND: ${{ inputs.ai_kind }}
          AI_EVAL_BASE_URL: ${{ inputs.ai_base_url || vars.AI_EVAL_BASE_URL }}
          AI_EVAL_MODEL: ${{ inputs.ai_model || vars.AI_EVAL_MODEL }}
          AI_EVAL_TYPES: ${{ inputs.types }}
          AI_EVAL_DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          export DOORPRINTS_EVAL_SUMMARY="$RUNNER_TEMP/ai-eval-summary.md"
          npx ng test --watch=false --include src/app/core/ai/ai-provider.live.spec.ts

      - name: Publish the summary
        if: always() && steps.key.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/ai-eval-summary.md" ]; then
            cat "$RUNNER_TEMP/ai-eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary was written: the setting was refused or the run failed before the first case (see the log)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The golden set through a small real model that runs on the runner, with no key (S4b-BL-175; docs/06 TC-AI-25;
  # docs/ai/ai-design.md 8.1). Ollama is installed from the official release, not with `curl | sh`: the tarball comes from the
  # release of the pinned version, and its sha256 must equal both the digest pinned here and the one in the release's own
  # sha256sum.txt (a mismatch stops the job before anything is unpacked). To move the pin: pick a release at
  # https://github.com/ollama/ollama/releases, read the line of ollama-linux-amd64.tar.zst in its sha256sum.txt, change the two
  # env values below together (Dependabot does not track this), and say so in docs/07 SEC-030.
  # Model (S4b-BL-190): the default is qwen2.5:0.5b (about 400 MB, 32K context, same library, takes the JSON response format
  # the ladder asks for). The first real run (2026-10-08) of qwen2.5:1.5b on the 3-core runner answered one case and the next
  # request hit the 60 s limit. The suite checks that the adapters and the ladder work against a real server, so the model
  # need not be good, only answer in time; qwen2.5:1.5b and :3b stay typeable in `local_model`. Any Ollama library tag works.
  # Time (S4b-BL-190), assumed, not measured: the harness gives each request 180 s here (AI_EVAL_TIMEOUT_MS; honoured by the
  # harness only for a server on localhost, the app's own limit stays 60 s). The longest prompt of the 75 cases is 14,256
  # characters (an Ask case: system text, the saved houses and the question), 10,648 for Extract and 7,477 for Plan with the
  # schema trailer of tier 2, measured by building every prompt; that is about 3,600 to 4,800 tokens at 3 to 4 characters per
  # token, plus up to 2,048 tokens of answer, so the 8192 context below holds with margin and is not lowered (Ollama cuts the
  # front of a prompt that does not fit without saying so). Most of a case's time on a CPU is reading that prompt. The job
  # allows 150 minutes: about 10 for the downloads and the build, 120 for the golden set (the live spec's own cap is
  # 7,200,000 ms), 20 margin; 75 cases at an average of 96 s fit, and a model that needs more is not for this runner. A timed-out
  # request is reported as unreachable and stops the run (S4b-BL-184), so a run that is too slow ends after one 180 s wait,
  # not after 75 of them. `types` is shared by every suite, so it cannot default differently here: choose `extract` (34 cases)
  # for a first run. Expect the first real run to show whether the tier-1 `json_schema` request is accepted or refused by this
  # Ollama build (a refusal sends the ladder to tier 2, which is what it is for). Ollama checks the layer digests of the model
  # it pulls. Reported, not gating: the job fails only on a wrong setting, a run that stopped early, or when no case got an
  # answer, like own-provider. Read-only token, no secrets, no id-token.
  local-model:
    name: Golden set through a local model (Ollama on the runner, no key)
    if: inputs.suites == 'local-model'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      OLLAMA_VERSION: v0.40.1
      # The line of ollama-linux-amd64.tar.zst in that release's sha256sum.txt (read 2026-10-08).
      OLLAMA_SHA256: a7aebbe3dd76ccf1351a56a3e57218ad4863cb5f9a9938c58de87a37555e355d
      OLLAMA_HOST: 127.0.0.1:11434
      # envconfig/config.go on main (read 2026-10-08): the default context is 4k to 256k by memory, so say it; the Ask prompt
      # carries house notes. And no cloud features: nothing leaves the runner but the model download.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # One request at a time (the harness is sequential): Ollama sizes the context memory for each parallel slot, and
      # the model stays loaded for the whole run (S4b-BL-190).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "1h"
      OLLAMA_NO_CLOUD: "1"
    steps:
      - name: Validate inputs
        env:
          LOCAL_MODEL: ${{ inputs.local_model }}
        run: |
          if ! [[ "$LOCAL_MODEL" =~ ^[a-z0-9][a-z0-9._/-]{0,62}(:[A-Za-z0-9._-]{1,32})?$ ]]; then
            echo "::error::local_model must be an Ollama library tag such as qwen2.5:1.5b"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the website's packages
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Ollama (pinned release, checksum verified)
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          dir="$RUNNER_TEMP/ollama-download"
          mkdir -p "$dir"
          base="https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}"
          curl -fsSL --retry 3 -o "$dir/ollama-linux-amd64.tar.zst" "$base/ollama-linux-amd64.tar.zst"
          curl -fsSL --retry 3 -o "$dir/sha256sum.txt" "$base/sha256sum.txt"
          published="$(awk '$2 == "./ollama-linux-amd64.tar.zst" { print $1 }' "$dir/sha256sum.txt")"
          if [ "$published" != "$OLLAMA_SHA256" ]; then
            echo "::error::The release ${OLLAMA_VERSION} now publishes a different sha256 ($published) than the one pinned in this workflow. Check the release, then update OLLAMA_SHA256."
            exit 1
          fi
          echo "$OLLAMA_SHA256  $dir/ollama-linux-amd64.tar.zst" | sha256sum --check --strict -
          sudo tar --zstd -xf "$dir/ollama-linux-amd64.tar.zst" -C /usr/local
          rm -rf "$dir"
          ollama --version

      - name: Start Ollama on 127.0.0.1 only
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:11434/api/version" >/dev/null 2>&1; then echo "ollama is up"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ollama.log"
          echo "::error::ollama serve did not come up"
          exit 1

      - name: Pull the model and load it once
        timeout-minutes: 25
        env:
          LOCAL_MODEL: ${{ inputs.local_model }}
        run: |
          ollama pull "$LOCAL_MODEL"
          # One tiny request loads the model and keeps it in memory for an hour, so the first case does not spend its time
          # on loading it; it asks for the JSON format as the cases do, so that part is set up before the first case too.
          curl -fsS --max-time 600 "http://127.0.0.1:11434/api/generate" \
            -d "$(jq -cn --arg m "$LOCAL_MODEL" '{model: $m, prompt: "Reply with {\"ok\": true}.", format: "json", stream: false, keep_alive: "1h", options: {num_predict: 16}}')" >/dev/null

      - name: Run the golden set (openai-compatible kind, no key)
        working-directory: web
        env:
          # No key: Ollama ignores it. ai-eval.ts runs a key-less setting only for an openai-compatible server on localhost.
          DOORPRINTS_EVAL_KEY: ""
          AI_EVAL_KIND: openai-compatible
          AI_EVAL_BASE_URL: http://127.0.0.1:11434/v1
          AI_EVAL_MODEL: ${{ inputs.local_model }}
          AI_EVAL_TYPES: ${{ inputs.types }}
          AI_EVAL_DELAY_MS: "0"
          # 180 s a request instead of the app's 60 s; the harness honours it only for a server on this machine (S4b-BL-190).
          AI_EVAL_TIMEOUT_MS: "180000"
        run: |
          export DOORPRINTS_EVAL_SUMMARY="$RUNNER_TEMP/ai-eval-summary.md"
          npx ng test --watch=false --include src/app/core/ai/ai-provider.live.spec.ts

      - name: Publish the summary
        if: always()
        run: |
          {
            echo "Ollama ${OLLAMA_VERSION} (sha256 pinned), CPU only, no key. A model this small is far weaker than the providers the app is used with: read this as a check that the adapter and the ladder work against a real server, not as the quality of any model."
            echo
            if [ -f "$RUNNER_TEMP/ai-eval-summary.md" ]; then
              cat "$RUNNER_TEMP/ai-eval-summary.md"
            else
              echo "No summary was written: the setting was refused or the run failed before the first case (see the log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ollama log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/ollama.log" || true
