# The user guide site (owner request of 2026-09-29: the user guide as a GitHub-hosted website; docs/13-user-guide.md,
# docs/10 §17). MkDocs Material builds guide/ into a static site; GitHub Pages serves it at
# https://sriram-codes-sw.github.io/doorprints/ (free for a public repository: zero-cost rule).
# - build: on a push to any branch or a pull request to main that touches the guide, so a broken page, link or image
#   fails before it can reach main (`mkdocs build --strict`).
# - deploy: main only (push or manual run), like the web deploy; needs Pages' source set to "GitHub Actions" in the
#   repository settings (owner, one time). Until then the deploy job fails and the build job still checks the site.
# Python packages are pinned with hashes (guide/requirements.txt from requirements.in by pip-compile
# --generate-hashes) and installed with --require-hashes; Dependabot keeps them current (.github/dependabot.yml).
name: User guide site

on:
  push:
    branches: ["**"]
    paths:
      - "guide/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for what it needs.
permissions: {}

# One build per ref; a deploy is never cancelled half-way (the Pages concurrency group).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the user guide (MkDocs, strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          # The version guide/requirements.txt was compiled with.
          python-version: "3.11"

      - name: Install MkDocs Material (pinned, hash-checked)
        run: python -m pip install --no-deps --require-hashes -r guide/requirements.txt

      - name: Build the site
        working-directory: guide
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
