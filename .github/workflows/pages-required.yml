# The "always report" twin of pages.yml (docs/07 section 3): the same workflow and job name, triggered by the
# complement of its paths (paths-ignore mirrors them exactly), succeeding at once, so the required check reports on
# a pull request that touches nothing under guide/. See android-required.yml.
name: User guide site

on:
  pull_request:
    paths-ignore:
      - "guide/**"
      - "android/app/src/test/screenshots/**"
      - "tools/guide-search-check/**"
      - ".github/workflows/pages.yml"

permissions: {}

jobs:
  build:
    name: Build the user guide (MkDocs, strict)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No guide input changed in this pull request; pages.yml did not run."
