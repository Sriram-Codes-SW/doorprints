# The "always report" twin of shared-ios.yml (docs/07 section 3): the same workflow and job names, triggered by the
# complement of its paths (paths-ignore mirrors them exactly), succeeding at once on a Linux runner (no macOS minute
# spent), so the required checks report on a pull request that touches no iOS input. See android-required.yml.
name: Shared iOS compile

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "android/app/src/main/assets/geo/**"
      - "android/shared/**"
      - "android/ui/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - ".github/workflows/shared-ios.yml"

permissions: {}

jobs:
  compile:
    name: ":shared iOS targets compile (macOS, JDK 21)"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No iOS input changed in this pull request; shared-ios.yml did not run."
  simulator-tests:
    name: ":shared and :ui tests on the iOS simulator"
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No iOS input changed in this pull request; shared-ios.yml did not run."
  ios-app:
    name: iOS app builds and launches (simulator)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No iOS input changed in this pull request; shared-ios.yml did not run."
