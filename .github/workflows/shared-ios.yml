# Shared KMP modules (android/shared, and android/ui with the Compose Multiplatform UI, ADR-23): compiles the iOS
# targets of both on macOS so the shared code is proved to stay
# iOS-compatible without an iPhone, a Mac of our own or a paid Apple Developer account (compiling a klib needs
# neither signing nor a device). macOS runners are free for public repositories.
# A separate workflow (not a job in android.yml) so GitHub's own path filter limits it to shared-code changes.
# Triggers (owner decision 2026-09-23, "be sure that the code is right before merging into main"): a push to ANY
# branch that touches one of the paths below, a pull request to main and manual runs. The two path lists are
# identical and must stay that way. Tag pushes do not trigger.
# CMP-8a (2026-09-29): Xcode is pinned (DEVELOPER_DIR, runner macos-26), and a second job, ios-sim-tests, runs the
# commonTest and iosTest suites of :shared and :ui on an iPhone simulator (Room with the bundled SQLite, the Keychain
# settings, the data folder's backup flag). It is a job of its own so a slow or failed simulator boot never fails the
# compile check, which may be required. `ios/**` and the Android copy of the boundary data are in the path lists for
# the iOS app of CMP-8b/8c, which bundles that file.
# CMP-8b (2026-09-29): a third job, ios-app, builds the iOS app (ios/, an XcodeGen project around the Kotlin framework
# DoorprintsKit of :ui) for the arm64 simulator, ad-hoc signed (no identity or Apple account), and launches it with its self-check on an iPhone simulator
# (ios/ci/launch-smoke.sh); the screenshot and the logs are uploaded. Again a job of its own, so the app's build or
# launch never fails the compile check.
# CMP-8c (2026-09-29): the app has the map, MapLibre iOS from its Swift package (pinned by revision in ios/project.yml,
# checkouts cached), with India's geo files bundled from android/app/src/main/assets/geo; ios-app checks both are in
# the app, and the launch smoke passes only with the self-check's indiaView and map lines (the in-app boundary check,
# the owner's CI gate for the iOS map; the on-device review is TC-M-28).
# S4b-BL-69 (2026-09-29): Hunt mode on iPhone. ios-app checks the location background mode is in the bundle, and the
# launch smoke grants the app location, sets a simulated location next to a house the self-check saves and requires
# its hunt line too (the device check is TC-M-31).
name: Shared iOS compile

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "android/app/src/main/assets/geo/**"
      - "android/shared/**"
      - "android/ui/**"
      # Root Gradle config pins the Kotlin/AGP versions and the module list, which can break the iOS build too.
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - ".github/workflows/shared-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "android/app/src/main/assets/geo/**"
      - "android/shared/**"
      - "android/ui/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
      - ".github/workflows/shared-ios.yml"
  workflow_dispatch:

# Least privilege: nothing by default; each job asks only for contents: read.
permissions: {}

# Xcode 26.4.1 on the macos-26 image (checked in each job: a missing Xcode fails loudly instead of silently using
# whatever the image's default is).
env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

# One run per ref: a newer push to a branch (or a pull request, ref refs/pull/<n>/merge) cancels the older run;
# runs on main always finish.
concurrency:
  group: shared-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shared-ios-compile:
    name: ":shared iOS targets compile (macOS, JDK 21)"  # name kept: it may be a required check; it covers :ui too
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Xcode 26.4.1 present
        working-directory: .
        run: test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 26.4.1 missing at $DEVELOPER_DIR"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Kotlin/Native toolchain and its dependencies (~/.konan) are not covered by setup-gradle; the key follows
      # the root build script, where the Kotlin version is pinned. Each job has its own key (github.job), so the three
      # jobs, which run at the same time, never race to save the same key; a job with no cache of its own yet restores
      # another job's (or one from before the per-job keys) through the second restore key.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('android/build.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            konan-${{ runner.os }}-${{ runner.arch }}-

      # Task names follow KGP's scheme compile[Test]Kotlin<Target>: the main klibs of both iOS targets plus the
      # simulator test klib (commonTest/iosTest code). Nothing is linked, signed or run on a simulator.
      - name: Compile iOS targets of :shared and :ui
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            :shared:compileTestKotlinIosSimulatorArm64 \
            :ui:compileKotlinIosArm64 \
            :ui:compileKotlinIosSimulatorArm64 \
            :ui:compileTestKotlinIosSimulatorArm64

  ios-sim-tests:
    name: ":shared and :ui tests on the iOS simulator"
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Xcode 26.4.1 present
        working-directory: .
        run: test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 26.4.1 missing at $DEVELOPER_DIR"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('android/build.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            konan-${{ runner.os }}-${{ runner.arch }}-

      # An available iPhone on the iOS runtime that matches the pinned Xcode's simulator SDK (26.4 for Xcode 26.4.1);
      # the image installs other runtimes too (26.2, 26.5), so the newest one is not taken. The iPhone chosen is the
      # last in name order. Its UDID goes to the test tasks (android/shared and android/ui build.gradle.kts, property
      # iosSimulatorDevice).
      - name: Pick an iPhone simulator
        id: sim
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime="iOS-$(echo "$sdk" | tr . -)"
          udid=$(xcrun simctl list devices available --json | RUNTIME="$runtime" python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          wanted = [r for r in devices if r.endswith("." + os.environ["RUNTIME"])]
          phones = sorted((d for r in wanted for d in devices[r] if d["name"].startswith("iPhone")), key=lambda d: d["name"])
          if phones:
              print(phones[-1]["udid"])
          ')
          test -n "$udid" || { echo "::error::no available iPhone simulator on runtime $runtime (SDK $sdk)"; xcrun simctl list devices available; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # The real-Keychain round trip needs a Keychain the test process may write; where the simulator has none for it
      # (errSecMissingEntitlement or errSecNotAvailable), the test prints "SKIPPED realKeychainRoundTrip" instead of failing, and this
      # step turns that line into a visible warning (the Keychain logic itself is covered by the fakes).
      - name: Run the simulator tests
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -PiosSimulatorDevice="$SIM_UDID" \
            :shared:iosSimulatorArm64Test :ui:iosSimulatorArm64Test 2>&1 | tee "$RUNNER_TEMP/sim-tests.log"
          if grep -rqs "SKIPPED realKeychainRoundTrip" "$RUNNER_TEMP/sim-tests.log" shared/build/test-results; then
            echo "::warning::realKeychainRoundTrip skipped: the simulator refused the real Keychain; only the fakes ran"
          fi

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-test-reports
          path: |
            android/shared/build/reports/tests
            android/shared/build/test-results
            android/ui/build/reports/tests
            android/ui/build/test-results
          retention-days: 14

  ios-app:
    name: "iOS app builds and launches (simulator)"
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Xcode 26.4.1 present
        run: test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 26.4.1 missing at $DEVELOPER_DIR"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JAVA_HOME set here reaches Gradle inside xcodebuild's Run Script (ios/project.yml looks there first).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('android/build.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
            konan-${{ runner.os }}-${{ runner.arch }}-

      # XcodeGen 2.46.0 from its GitHub release, checked against the SHA-256 of the zip as downloaded on 2026-09-29
      # (a Homebrew install would take whatever version the formula has then). The binary finds its setting presets
      # in ../share/xcodegen, so it runs from the unpacked folder.
      - name: Install XcodeGen 2.46.0
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project and check the plists
        run: |
          xcodegen --version
          xcodegen generate --spec ios/project.yml
          plutil -lint ios/Doorprints/Info.plist ios/Doorprints/*.lproj/InfoPlist.strings

      # The framework on its own first, so a Kotlin error shows here plainly rather than deep in xcodebuild's log; the
      # Gradle daemon and the build outputs it leaves are reused by the Run Script of the next step.
      - name: Link the Kotlin framework (:ui, simulator, Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :ui:linkDebugFrameworkIosSimulatorArm64

      # Ad-hoc signed (CODE_SIGN_IDENTITY=-, owner-approved): no certificate, team or Apple account, but a real code
      # signature, which the simulator needs to give the app its own Keychain (an unsigned app gets
      # errSecMissingEntitlement, and the self-check's keychain line would only SKIP). project.yml signs manually with
      # the same identity for the simulator, so xcodebuild asks for no team; CODE_SIGNING_REQUIRED=NO lets it build
      # without a provisioning profile. CODE_SIGNING_ALLOWED stays at its default (YES).
      # MapLibre iOS's Swift package (ios/project.yml, pinned by revision): its checkout and xcframework (about 100 MB)
      # kept between runs; the key changes when project.yml, and so the pin, does.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/project.yml') }}

      - name: Build the app (Debug, arm64 simulator)
        run: |
          mkdir -p "$RUNNER_TEMP/ios-app"
          set -o pipefail
          xcodebuild build \
            -project ios/Doorprints.xcodeproj \
            -scheme Doorprints \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/ios-app/xcodebuild.log"

      # What the Gradle step and the plist must have put in the bundle: the Compose resources (without them every
      # string lookup fails at run time), the 120 Hz key, the four localisations of the purpose strings, MapLibre and
      # the geo files (CMP-8c) and the ad-hoc signature.
      - name: Check the app bundle
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Doorprints.app"
          test -d "$app" || { echo "::error::no app at $app"; exit 1; }
          res=$(find "$app" -type d -name compose-resources | head -n 1)
          test -n "$res" || { echo "::error::compose-resources missing from the app bundle"; exit 1; }
          echo "Compose resources: $res ($(find "$res" -type f | wc -l | tr -d ' ') files)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$app/Info.plist")" = true \
            || { echo "::error::CADisableMinimumFrameDurationOnPhone is not true in the built Info.plist"; exit 1; }
          for key in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription NSLocalNetworkUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" > /dev/null \
              || { echo "::error::$key missing from the built Info.plist"; exit 1; }
          done
          for lang in en hi ta te; do
            test -f "$app/$lang.lproj/InfoPlist.strings" || { echo "::error::$lang.lproj/InfoPlist.strings missing"; exit 1; }
          done
          # Hunt mode (S4b-BL-69): background location updates need the mode, or Core Location throws at start.
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" | grep -q '^ *location$' \
            || { echo "::error::UIBackgroundModes in the built Info.plist lacks 'location' (Hunt mode)"; exit 1; }
          # The map (CMP-8c): MapLibre iOS embedded at the pinned revision, and India's geo files bundled unchanged.
          test -d "$app/Frameworks/MapLibre.framework" || { echo "::error::MapLibre.framework is not embedded in the app"; exit 1; }
          resolved=ios/Doorprints.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          grep -q '"revision" *: *"13e41ab3d77ff5113e7e5d4ee87803b1f81f5683"' "$resolved" \
            || { echo "::error::$resolved does not pin MapLibre to the revision in ios/project.yml"; cat "$resolved"; exit 1; }
          for f in in-boundaries.geojson in-held-areas.geojson; do
            cmp "$app/geo/$f" "android/app/src/main/assets/geo/$f" || { echo "::error::geo/$f in the app differs from the repository's"; exit 1; }
          done
          # The ad-hoc signature the Keychain needs (see the build step).
          codesign --verify "$app" || { echo "::error::the app bundle is not signed"; exit 1; }
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Signature)=' || true

      # ios/ci/launch-smoke.sh: an iPhone on the SDK's runtime (as in ios-sim-tests), install, launch with
      # -DoorprintsSelfCheck, pass only on "DOORPRINTS-SELFCHECK done PASS"; screenshot, console log and any crash
      # reports go to $RUNNER_TEMP/ios-app.
      - name: Launch smoke test on an iPhone simulator
        run: |
          chmod +x ios/ci/launch-smoke.sh
          ios/ci/launch-smoke.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Doorprints.app" "$RUNNER_TEMP/ios-app"

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-launch
          path: ${{ runner.temp }}/ios-app
          if-no-files-found: ignore
          retention-days: 14
