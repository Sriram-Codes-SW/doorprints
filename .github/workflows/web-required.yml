# The "always report" twin of web.yml (docs/07 section 3): the same workflow and job name, triggered by the
# complement of its paths (paths-ignore mirrors them exactly), succeeding at once, so the required check reports on
# a pull request that touches no web input. See android-required.yml.
name: Web

on:
  pull_request:
    paths-ignore: ["web/**", ".github/workflows/web.yml", ".github/firebase-tools/**"]

permissions: {}

jobs:
  build:
    name: ng test + ng build (Node 24)
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - run: echo "No web input changed in this pull request; web.yml did not run."
