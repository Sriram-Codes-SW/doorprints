# Doorprints Android: one place for every plugin and library version (Sprint 3.5, 2026-09-22).
# :app and :shared both read this catalog, so the Kotlin, serialization, coroutines and Ktor versions cannot drift apart.
# Versions checked against upstream tags on 2026-09-22 (git ls-remote): Ktor 3.6.0, kotlinx.coroutines 1.11.0,
# kotlinx.serialization 1.11.0, Kotlin 2.4.10. Ktor 3.6.0 itself is built against coroutines 1.11.0, serialization
# 1.11.0, kotlinx-io 0.9.1 and OkHttp 5.5.0, so these are aligned rather than mixed.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
ktor = "3.6.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
compose-bom = "2026.09.00"
material-icons-core = "1.7.8"
# Compose Multiplatform (JetBrains) for the :ui module (ADR-23). CMP 1.12.1 depends on androidx.compose ui/runtime/
# foundation 1.12.1 on Android, material3 1.9.0 on androidx material3 1.4.0 and icons 1.7.3 on androidx 1.7.3. Gradle
# takes the higher version, so CMP's androidx mapping must not be newer than the BOM's (2026.09.00: ui 1.12.1,
# material3 1.4.0; icons stay at :app's 1.7.8). Check both again on every CMP or BOM bump.
cmp = "1.12.1"
cmp-material3 = "1.9.0"
cmp-material-icons = "1.7.3"
androidx-core = "1.19.0"
androidx-activity = "1.11.0"
androidx-navigation = "2.9.5"
androidx-lifecycle = "2.9.4"
androidx-room = "2.8.5"
# androidx.sqlite: the version Room 2.8.5 depends on. Only iOS uses the bundled driver (CMP-4 P4a); Android keeps the
# framework SQLite through Room's SupportSQLite open helper, as before.
androidx-sqlite = "2.6.2"
androidx-work = "2.10.1"
androidx-datastore = "1.1.7"
androidx-exifinterface = "1.4.2"
play-services-location = "21.4.0"
coil = "3.6.3"
maplibre = "13.6.1"
junit = "4.13.2"
# Android test harness (screenshot tests on the JVM, emulator smoke tests). Robolectric renders the app's real screens
# on the JVM; Roborazzi records and compares their screenshots. androidx.test for the instrumented (emulator) tests.
robolectric = "4.17"
roborazzi = "1.75.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-core = "1.7.0"
androidx-test-rules = "1.7.0"
androidx-test-services = "1.6.0"

[libraries]
# Compose (versions come from the BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "material-icons-core" }

# Compose Multiplatform libraries (commonMain of :ui)
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "cmp" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "cmp" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "cmp" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmp-material3" }
cmp-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "cmp" }
cmp-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "cmp-material-icons" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidx-lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "androidx-room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }

# Ktor client (shared module). commonMain: core only; androidMain: the OkHttp engine; commonTest: MockEngine.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-services-storage = { module = "androidx.test.services:storage", version.ref = "androidx-test-services" }
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "androidx-test-services" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP's Android target for Kotlin Multiplatform libraries (replaces com.android.library + androidTarget() in KMP modules).
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room's Gradle plugin (CMP-4 P4a): schema export for the Room KMP database in :shared (room { schemaDirectory }).
androidx-room = { id = "androidx.room", version.ref = "androidx-room" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
# Compose Multiplatform Gradle plugin: only for :ui's resources (composeResources -> the generated Res class).
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "cmp" }
