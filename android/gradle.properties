org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# :shared declares iosArm64 and iosSimulatorArm64 so commonMain cannot use JVM/Android APIs (shared/README.md, section 5).
# Kotlin/Native on a non-Mac host (2026-09-22; android.yml comment to be aligned by DevSecOps):
# - enableKlibsCrossCompilation=false: KGP 2.4.10 defaults this to true, which makes the iOS compile tasks run on Linux
#   too, and :shared:allTests (android.yml, ubuntu) would then compile the iOS main and test klibs there. Those klibs
#   depend on Ktor's Apple klibs (platform.Foundation etc.), which is not a set-up we can test on Linux, so on
#   ubuntu the iOS compile, link and test tasks are skipped and :shared:allTests runs the Android host tests only.
#   The iOS compile check runs on macOS (shared-ios.yml), where this flag has no effect: iOS targets are native there.
# - ignoreDisabledTargets=true: hides the "targets cannot be built on this host" notice for those skipped targets.
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true
